<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · Marle-G</title>
<style>
  :root{ --bg:#080a0e;--bg2:#0e1116;--card:#14171e;--border:rgba(255,255,255,.08);
    --ink:#eef1f6;--muted:#9aa3b4;--dim:#646c7a;--mono:'SF Mono',ui-monospace,Consolas,monospace;
    --saffron:#ff9933;--india-green:#138808;--green:#22c55e;--red:#ef4444;--amber:#fbbf24;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1100px 520px at 50% -10%,rgba(255,153,51,.05),transparent 60%),var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--border);background:rgba(8,10,14,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .brand{font-family:var(--mono);font-weight:800;letter-spacing:.18em;font-size:13px;display:flex;align-items:center;gap:9px}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--saffron),var(--india-green))}
  .brand .w{background:linear-gradient(90deg,var(--saffron),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabs{display:flex;gap:16px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
  .tabs a{color:var(--dim);text-decoration:none}.tabs a.on{color:var(--saffron)}.tabs a:hover{color:var(--ink)}
  .preview-tag{font-family:var(--mono);font-size:9px;color:#0a0b0f;background:var(--amber);padding:3px 8px;border-radius:5px;font-weight:800}
  .wrap{max-width:980px;margin:0 auto;padding:24px 24px 70px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:780px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
  .sh{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:12px}
  .uhead{display:flex;align-items:center;gap:16px}
  .avatar{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--saffron),var(--india-green));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#0a0b0f}
  .uname{font-size:20px;font-weight:800} .uemail{font-family:var(--mono);font-size:12px;color:var(--muted)}
  label{font-family:var(--mono);font-size:10px;color:var(--dim);display:block;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  input,select{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px}
  .btn{font-family:var(--mono);font-size:12px;border-radius:9px;padding:11px 16px;cursor:pointer;border:none;background:linear-gradient(135deg,var(--saffron),var(--india-green));color:#0a0b0f;font-weight:800;margin-top:14px}
  .btn.ghost{background:var(--bg2);border:1px solid var(--border);color:var(--muted);font-weight:400}
  .q{margin-bottom:14px} .q .qt{font-size:13px;margin-bottom:8px}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{font-family:var(--mono);font-size:11px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}
  .opt.sel{border-color:var(--saffron);background:rgba(255,153,51,.1);color:var(--saffron)}
  .result{background:rgba(255,153,51,.06);border:1px solid rgba(255,153,51,.2);border-radius:10px;padding:14px;font-family:var(--mono);margin-top:10px}
  .result .big{font-size:22px;font-weight:800;color:var(--saffron)}
  .wl{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--mono);font-size:12px}
  .wl .x{color:var(--dim);cursor:pointer}.wl .x:hover{color:var(--red)}
  .kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}.kv .k{color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--saffron);color:var(--ink);font-family:var(--mono);font-size:12px;padding:11px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
  .legend{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="nav">
  <div class="brand"><span class="mark"></span><span>MARLE<span class="w">·G</span></span></div>
  <div class="tabs">
    <a href="marle_g_pod.html">home</a><a href="marle_g_equity.html">equity</a><a href="marle_g_volume.html">volume</a><a href="marle_g_options.html">options</a>
    <a href="marle_g_funds.html">funds</a><a href="marle_g_portfolio.html">portfolio</a>
    <a href="marle_g_macro_preview.html">macro</a><a href="marle_g_dashboard.html">dashboard</a><a href="#" class="on">profile</a>
  </div>
</div>

<main class="wrap">
  <div class="card">
    <div class="uhead">
      <div class="avatar" id="avatar">S</div>
      <div style="flex:1"><div class="uname" id="uname">Guest</div><div class="uemail" id="uemail">not signed in</div></div>
      <span id="profile-pill" style="font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:8px;background:rgba(255,153,51,.12);color:var(--saffron);font-weight:700"></span>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="sh">Account</div>
      <label>Name</label><input id="name" placeholder="Your name" value="">
      <label>Email</label><input id="email" placeholder="you@email.com" value="">
      <button class="btn" onclick="saveAccount()">Save account</button>
      <button class="btn ghost" onclick="logout()" style="margin-left:8px">Sign out</button>
    </div>

    <div class="card">
      <div class="sh">Preferences</div>
      <label>Default landing</label>
      <select id="pref-land"><option value="marle_g_pod.html">Pod home</option><option value="marle_g_macro_preview.html">Macro</option><option value="marle_g_equity.html">Equity monitor</option><option value="marle_g_dashboard.html">Dashboard</option></select>
      <label>Base currency</label><select id="pref-cur"><option>INR ₹</option></select>
      <label>Theme</label><select id="pref-theme"><option>Saffron / Green (flag)</option><option>Dark mono</option></select>
      <button class="btn" onclick="savePrefs()">Save preferences</button>
    </div>
  </div>

  <div class="card">
    <div class="sh">Risk-profile onboarding</div>
    <div id="survey"></div>
    <div class="result" id="risk-result" style="display:none"></div>
  </div>

  <div class="card">
    <div class="sh">My watchlists</div>
    <div id="watchlists"></div>
    <div class="legend">Built from the macro sector drill-down. Shared with the Dashboard.</div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
function getP(){try{return JSON.parse(localStorage.getItem('marleg_profile')||'{}');}catch(e){return {};}}
function setP(p){localStorage.setItem('marleg_profile',JSON.stringify(p));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

const QS=[
  {id:'tol',q:'If your portfolio dropped 20% in a month, you would…',opts:[['Buy more',3],['Hold',2],['Sell some',1],['Sell all',0]]},
  {id:'horizon',q:'Primary investment horizon?',opts:[['< 1 year',0],['1–3 years',1],['3–7 years',2],['7+ years',3]]},
  {id:'conc',q:'Largest single position you are comfortable with?',opts:[['< 5%',0],['5–15%',1],['15–30%',2],['> 30%',3]]},
  {id:'exp',q:'Trading experience?',opts:[['New',0],['Some',1],['Active (F&O)',3]]},
];
let answers={};
function renderSurvey(){
  $('survey').innerHTML=QS.map(q=>`<div class="q"><div class="qt">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<span class="opt ${answers[q.id]===o[1]?'sel':''}" onclick="pick('${q.id}',${o[1]})">${o[0]}</span>`).join('')}</div></div>`).join('')+
    `<button class="btn" onclick="computeRisk()">Compute risk profile</button>`;
  const p=getP(); if(p.riskProfile) showResult(p.riskProfile,p.riskScore);
}
function pick(id,v){answers[id]=v;renderSurvey();}
function computeRisk(){
  if(Object.keys(answers).length<QS.length){toast('answer all questions');return;}
  const score=Object.values(answers).reduce((a,b)=>a+b,0), max=QS.reduce((a,q)=>a+Math.max(...q.opts.map(o=>o[1])),0);
  const r=score/max;
  const profile=r>=0.66?'Aggressive':r>=0.33?'Balanced':'Conservative';
  const cap=profile==='Aggressive'?25:profile==='Balanced'?12:6;
  const p=getP(); p.riskAnswers=answers; p.riskProfile=profile; p.riskScore=score; p.posCap=cap; setP(p);
  showResult(profile,score); updateHead(); toast('Risk profile saved: '+profile);
}
function showResult(profile,score){
  const cap=profile==='Aggressive'?25:profile==='Balanced'?12:6;
  const desc={Aggressive:'High conviction, concentrated. Accepts noise for higher signals.',Balanced:'Diversified core with tactical tilts.',Conservative:'Capital preservation first; large-caps + debt.'}[profile];
  $('risk-result').style.display='';
  $('risk-result').innerHTML=`<div class="big">${profile}</div><div style="font-size:12px;color:var(--muted);margin-top:4px">${desc}</div>
    <div class="kv" style="margin-top:8px"><span class="k">Default position-size cap</span><span>${cap}% per name</span></div>
    <div class="kv"><span class="k">Signal threshold</span><span>${profile==='Conservative'?'high-confidence only':profile==='Balanced'?'standard':'accepts more noise'}</span></div>`;
}
function updateHead(){
  const p=getP();
  $('uname').textContent=p.name||'Guest'; $('uemail').textContent=p.email||'not signed in';
  $('avatar').textContent=(p.name||'S').trim().charAt(0).toUpperCase();
  $('profile-pill').textContent=p.riskProfile?('★ '+p.riskProfile):'';
  if(p.name)$('name').value=p.name; if(p.email)$('email').value=p.email;
  if(p.prefLand)$('pref-land').value=p.prefLand;
}
function saveAccount(){const p=getP();p.name=$('name').value.trim();p.email=$('email').value.trim();setP(p);updateHead();toast('Account saved');}
function savePrefs(){const p=getP();p.prefLand=$('pref-land').value;p.theme=$('pref-theme').value;setP(p);toast('Preferences saved');}
function logout(){if(confirm('Sign out and clear profile?')){localStorage.removeItem('marleg_profile');location.reload();}}
function renderWatch(){
  let wl={};try{wl=JSON.parse(localStorage.getItem('marleg_watchlists')||'{}');}catch(e){}
  const names=Object.keys(wl);
  $('watchlists').innerHTML=names.length?names.map(n=>`<div class="wl"><span>★ ${n} <span style="color:var(--dim)">· ${wl[n].length} stocks</span></span><span class="x" onclick="delWL('${n.replace(/'/g,"\\'")}')">✕ delete</span></div>`).join(''):
    '<div style="font-family:var(--mono);font-size:11px;color:var(--dim)">No watchlists yet — build one from the <a href="marle_g_macro_preview.html" style="color:var(--saffron)">macro sector drill-down</a>.</div>';
}
function delWL(n){let wl=JSON.parse(localStorage.getItem('marleg_watchlists')||'{}');delete wl[n];localStorage.setItem('marleg_watchlists',JSON.stringify(wl));renderWatch();}
answers=getP().riskAnswers||{};updateHead();renderSurvey();renderWatch();
</script>
  <script src="marle_g_nav.js"></script>
</body>
</html>
