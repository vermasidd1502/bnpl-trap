<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movers & Volatility · Marle-G</title>
<style>
  :root{ --bg:#080a0e;--bg2:#0e1116;--card:#14171e;--border:rgba(255,255,255,.08);
    --ink:#eef1f6;--muted:#9aa3b4;--dim:#646c7a;--mono:'SF Mono',ui-monospace,Consolas,monospace;
    --saffron:#ff9933;--india-green:#138808;--green:#22c55e;--red:#ef4444;--amber:#fbbf24;--blue:#60a5fa;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1100px 520px at 50% -10%,rgba(255,153,51,.05),transparent 60%),var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--border);background:rgba(8,10,14,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .brand{font-family:var(--mono);font-weight:800;letter-spacing:.18em;font-size:13px;display:flex;align-items:center;gap:9px}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--saffron),var(--india-green))}
  .brand .w{background:linear-gradient(90deg,var(--saffron),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabs{display:flex;gap:16px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}.tabs a{color:var(--dim);text-decoration:none}
  .preview-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--saffron);border:1px solid var(--saffron);border-radius:5px;padding:3px 7px}
  .wrap{max-width:1340px;margin:0 auto;padding:20px 24px 90px}
  .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .head h1{font-size:24px;font-weight:800}.head .sub{font-family:var(--mono);font-size:11px;color:var(--dim)}
  /* top strip */
  .strip{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 20px}
  .kpi{flex:1;min-width:150px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
  .kpi .l{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
  .kpi .v{font-family:var(--mono);font-weight:800;font-size:20px;margin-top:4px}
  .kpi .d{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
  /* engine grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
  .eng{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 17px;cursor:pointer;transition:border-color .14s,transform .14s;position:relative}
  .eng:hover{border-color:var(--saffron);transform:translateY(-2px)}
  .eng.on{border-color:var(--saffron);box-shadow:0 0 0 1px var(--saffron) inset}
  .eng .et{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px}
  .eng .ei{font-size:18px}
  .eng .eh{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5;min-height:32px}
  .eng .ebadge{font-family:var(--mono);font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;position:absolute;top:14px;right:14px}
  .eng .more{font-family:var(--mono);font-size:9.5px;color:var(--saffron);margin-top:10px}
  /* detail */
  .detail{background:var(--card);border:1px solid var(--saffron);border-radius:14px;margin-top:16px;overflow:hidden;display:none}
  .detail.show{display:block}
  .dh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);background:rgba(255,153,51,.05)}
  .dh .t{font-weight:800;font-size:16px;display:flex;align-items:center;gap:9px}
  .dh .x{font-family:var(--mono);font-size:12px;color:var(--dim);cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:5px 10px}
  .dh .x:hover{color:var(--ink);border-color:var(--saffron)}
  .dtabs{display:flex;gap:4px;padding:12px 18px 0}
  .dtabs button{font-family:var(--mono);font-size:11px;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;padding:7px 12px;cursor:pointer}
  .dtabs button.on{color:var(--saffron);border-bottom-color:var(--saffron);font-weight:700}
  .dbody{padding:16px 18px 20px}
  .theory{font-family:Inter,sans-serif;font-size:13px;line-height:1.65;color:var(--muted);max-width:820px}
  .theory h4{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--saffron);margin:14px 0 6px}
  .theory b{color:var(--ink)} .theory .anchor{color:var(--blue);font-style:italic}
  .theory ul{margin:6px 0 6px 18px}.theory li{margin:3px 0}
  /* tables/chips reused */
  table{width:100%;border-collapse:collapse}
  th{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);text-align:right;padding:7px 9px;font-weight:600}th:first-child{text-align:left}
  td{padding:8px 9px;font-size:12px;border-top:1px solid rgba(255,255,255,.04);text-align:right;font-family:var(--mono)}td:first-child{text-align:left}
  tr.stk{cursor:pointer}tr.stk:hover{background:rgba(255,153,51,.07)}
  .sym{font-weight:800}.cmp{color:var(--dim);font-size:10px;display:block;font-family:Inter,sans-serif}
  .mp{font-family:var(--mono);font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px}
  .mp.HIGH{background:rgba(34,197,94,.18);color:var(--green)}.mp.MED{background:rgba(251,191,36,.15);color:var(--amber)}.mp.LOW{background:rgba(255,255,255,.06);color:var(--dim)}
  .pos{color:var(--green)}.neg{color:var(--red)}
  .fl{font-size:11px;margin-left:3px;cursor:help}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
  .sc{font-family:var(--mono);font-size:10.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--border)}
  .sc.def{color:var(--green);border-color:rgba(34,197,94,.4)}.sc.hot{color:var(--amber);border-color:rgba(251,191,36,.4)}
  .ctrl{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .ctrl button{font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:6px 11px;cursor:pointer}
  .ctrl button.on{background:var(--saffron);color:#160f02;border-color:var(--saffron);font-weight:700}
  .tier{display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid rgba(255,255,255,.05)}
  .tier .tn{font-family:var(--mono);font-weight:800;font-size:12px;width:96px;flex:0 0 auto}.tier .tv{font-family:var(--mono);font-size:10.5px;color:var(--dim);width:110px;flex:0 0 auto}.tier .te{font-family:Inter,sans-serif;font-size:11px;color:var(--muted)}
  .note{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:10px;line-height:1.5}
  .empty{color:var(--muted);padding:18px;font-family:var(--mono);font-size:11px}
</style>
</head>
<body>
<div class="nav">
  <div class="brand"><span class="mark"></span><span>MARLE<span class="w">·G</span></span></div>
  <div class="tabs"></div>
  <span class="preview-tag">MOVERS</span>
</div>

<main class="wrap">
  <div class="head"><h1>⚡ Movers & Volatility</h1><span class="sub" id="sub">loading the engines…</span></div>
  <div class="strip" id="strip"></div>
  <div class="grid" id="grid"></div>
  <div class="detail" id="detail">
    <div class="dh"><div class="t" id="dt"></div><div class="x" onclick="closeEng()">✕ close</div></div>
    <div class="dtabs"><button id="tabA" class="on" onclick="setTab('a')">live analysis</button><button id="tabT" onclick="setTab('t')">📖 the theory</button></div>
    <div class="dbody" id="dbody"></div>
  </div>
</main>

<script src="marleg_stockmodal.js"></script>
<script>
window.MG_SELF_REFRESH=true;
const $=id=>document.getElementById(id);
const pct=x=>(x>0?'+':'')+(+x).toFixed(1)+'%';
let D={}, OPEN=null, TAB='a', MFILT='HIGH';

async function jget(u){ try{ return await (await fetch(u)).json(); }catch(e){ return null; } }
async function loadAll(){
  const [mov,vix,tiers,lc,shock,ind]=await Promise.all([jget('/api/movers'),jget('/api/vix'),jget('/api/tiers'),jget('/api/lastcandle'),jget('/api/shock'),jget('/api/industry_rs')]);
  D={mov,vix,tiers,lc,shock,ind};
  $('sub').textContent=(mov&&mov.asof)?('radar as of '+mov.asof+' · click any engine for analysis + theory'):'click any engine for analysis + theory';
  renderStrip(); renderCards(); if(OPEN) renderDetail();
}

function renderStrip(){
  const v=D.vix&&D.vix.asof_vix, sh=D.shock||{}, mov=D.mov||{};
  const rmap={CALM:'var(--green)',NORMAL:'var(--green)',ELEVATED:'var(--amber)',STRESS:'var(--red)'};
  const sq=(mov.movers||[]).filter(x=>x.short_covering).length;
  const cells=[
    ['India VIX', v?v.vix:'—', v?(v.regime+' · '+pct(v.chg5d||0)+'/5d'):'', v?rmap[v.regime]:'var(--ink)'],
    ['Macro gate', sh.badge||'—', (sh.verdict||'').slice(0,42), sh.badge&&sh.badge.includes('BULL')?'var(--green)':sh.badge&&(sh.badge.includes('BEAR')||sh.badge.includes('SHOCK'))?'var(--red)':'var(--amber)'],
    ['HIGH-amplitude', mov.n_high!=null?mov.n_high:'—', 'of '+(mov.n||'—')+' F&O — can do 3–8%','var(--saffron)'],
    ['Squeeze (covering)', sq||'0', 'price↑ + OI↓ in top movers','var(--blue)'],
  ];
  $('strip').innerHTML=cells.map(c=>'<div class="kpi"><div class="l">'+c[0]+'</div><div class="v" style="color:'+c[3]+'">'+c[1]+'</div><div class="d">'+c[2]+'</div></div>').join('');
}

const ENGINES=[
  {id:'squeeze',icon:'🔥',title:'Squeeze Radar',badge:d=>{const n=(d.mov&&d.mov.movers||[]).filter(x=>x.short_covering||x.bounce_shape).length;return n?['#'+n,'var(--blue)']:null;},
   sum:d=>{const m=d.mov||{};return 'Auto-scans all '+(m.n||'~190')+' F&O names for short-covering (price↑+OI↓) & abnormal-up moves — now news/earnings-gated.';}},
  {id:'amp',icon:'🎯',title:'Move-Potential',badge:d=>{const n=(d.mov&&d.mov.n_high)||0;return ['HIGH '+n,'var(--green)'];},
   sum:d=>'The 3–8%/day amplitude filter: ATR% + how often a name has done ≥5% days. Only HIGH can hit your target routinely.'},
  {id:'vix',icon:'🌪',title:'VIX Conscience',badge:d=>{const v=d.vix&&d.vix.asof_vix;return v?[v.regime,v.regime==='STRESS'?'var(--red)':'var(--green)']:null;},
   sum:d=>'Which sectors lead when VIX is calm vs which hold up when it spikes — when to chase amplitude vs sit out.'},
  {id:'drivers',icon:'🧭',title:'Why VIX is Moving',badge:d=>null,
   sum:d=>{const dr=d.vix&&d.vix.drivers;return dr?dr.attribution.slice(0,120):'Attributes the VIX move to US VIX / crude / gold / USDINR / NIFTY.';}},
  {id:'tiers',icon:'🪜',title:'5-Tier Ladder',badge:d=>['T1=⚡','var(--saffron)'],
   sum:d=>'Industries ranked by volatility. Tier-1 (CapGoods/Defense/Renewables) = where 3–8% amplitude lives.'},
  {id:'lastcandle',icon:'🕯',title:'Last-Candle Confluence',badge:d=>{const r=d.lc&&d.lc.results&&d.lc.results.full;return r?[r.win+'% win','var(--amber)']:['indicative','var(--dim)'];},
   sum:d=>'Does a final-10-min volume spike + fib + Ichimoku + U/D predict the next day? (backtested, honest)'},
  {id:'macro',icon:'🏭',title:'Industry Macro',badge:d=>{const g=(d.ind&&d.ind.groups)||[];const n=g.filter(x=>x.leading).length;return n?[n+' leading','var(--green)']:null;},
   sum:d=>'Which industries are leading vs lagging (momentum + breadth) — fish for longs only in green sectors.'},
];

function renderCards(){
  $('grid').innerHTML=ENGINES.map(e=>{
    const b=e.badge(D);
    return '<div class="eng'+(OPEN===e.id?' on':'')+'" onclick="openEng(\''+e.id+'\')">'+
      (b?'<span class="ebadge" style="background:rgba(255,255,255,.06);color:'+b[1]+'">'+b[0]+'</span>':'')+
      '<div class="et"><span class="ei">'+e.icon+'</span>'+e.title+'</div>'+
      '<div class="eh">'+e.sum(D)+'</div><div class="more">click to expand ▾</div></div>';
  }).join('');
}
function openEng(id){ OPEN=(OPEN===id?null:id); TAB='a'; renderCards(); if(OPEN){ $('detail').classList.add('show'); renderDetail(); $('detail').scrollIntoView({behavior:'smooth',block:'nearest'});} else $('detail').classList.remove('show'); }
function closeEng(){ OPEN=null; renderCards(); $('detail').classList.remove('show'); }
function setTab(t){ TAB=t; $('tabA').classList.toggle('on',t==='a'); $('tabT').classList.toggle('on',t==='t'); renderDetail(); }
function renderDetail(){
  const e=ENGINES.find(x=>x.id===OPEN); if(!e)return;
  $('dt').innerHTML='<span style="font-size:20px">'+e.icon+'</span> '+e.title;
  $('dbody').innerHTML = TAB==='t' ? (THEORY[e.id]||'<div class="empty">—</div>') : (ANALYSIS[e.id]?ANALYSIS[e.id]():'<div class="empty">—</div>');
}

/* ---------- live analysis per engine ---------- */
function movTable(filter){
  let rows=(D.mov&&D.mov.movers||[]).slice();
  if(filter==='HIGH') rows=rows.filter(x=>x.tag==='HIGH');
  else if(filter==='sq') rows=rows.filter(x=>x.short_covering||x.abnormal_up||x.bounce_shape);
  else if(filter==='clean') rows=rows.filter(x=>x.tag==='HIGH'&&x.clean!==false);
  if(!rows.length) return '<div class="empty">none match.</div>';
  let h='<table><thead><tr><th>name</th><th>amp</th><th>ATR%</th><th>P≥5%</th><th>ret5</th><th>RVOL</th><th>price</th><th>exp range</th></tr></thead><tbody>';
  rows.slice(0,40).forEach(r=>{let fl='';
    if(r.short_covering)fl+=' <span class="fl" title="'+(r.oi_signal||'short covering')+'">🔥</span>';
    if(r.bounce_shape)fl+=' <span class="fl" title="sharp up after a downtrend — squeeze shape">↩</span>';else if(r.abnormal_up)fl+=' <span class="fl" title="abnormal up-move on volume">⚡</span>';
    if(r.clean===false)fl+=' <span class="fl" title="'+((r.event_flags||[]).join("; ")||"event/news").replace(/"/g,'')+'">⚠</span>';
    h+='<tr class="stk" data-s="'+r.s+'"><td><span class="sym">'+r.s+'</span>'+fl+'<span class="cmp">'+(r.n||'').replace(/[<>]/g,'')+'</span></td>'+
      '<td><span class="mp '+r.tag+'">'+r.tag+'</span></td><td>'+r.atrp+'</td><td>'+r.p5+'%</td>'+
      '<td class="'+(r.ret5>=0?'pos':'neg')+'">'+pct(r.ret5)+'</td><td>'+r.rvol+'×</td><td>₹'+r.price+'</td><td style="color:var(--dim)">₹'+r.exp_lo+'–'+r.exp_hi+'</td></tr>';
  });
  return h+'</tbody></table>';
}
function bindStk(){ setTimeout(()=>document.querySelectorAll('#dbody tr.stk').forEach(tr=>tr.onclick=()=>openDossier(tr.dataset.s)),0); }
const ANALYSIS={
  squeeze:()=>{const html='<div class="ctrl"><button class="'+(MFILT==="sq"?"on":"")+'" onclick="MFILT=\'sq\';renderDetail()">🔥 squeeze/abnormal</button><button class="'+(MFILT==="HIGH"?"on":"")+'" onclick="MFILT=\'HIGH\';renderDetail()">⚡ HIGH amp</button><button class="'+(MFILT==="clean"?"on":"")+'" onclick="MFILT=\'clean\';renderDetail()">🔒 HIGH + news-clean</button><button class="'+(MFILT==="all"?"on":"")+'" onclick="MFILT=\'all\';renderDetail()">all</button></div>'+movTable(MFILT)+'<div class="note">🔥 short-covering (F&O OI) · ↩ bounce shape · ⚡ abnormal up · ⚠ earnings/news (gated). India has no equity short-interest — these are covering/abnormal proxies.</div>'; bindStk(); return html;},
  amp:()=>{const html=movTable('HIGH')+'<div class="note">HIGH = ATR% ≥ 3 (can do 3–8% routinely). P≥5% = how often it has actually printed a ≥5% day. Amplitude, not a promise — pair with the War Room daily loss-limit.</div>'; bindStk(); return html;},
  vix:()=>{const S=(D.vix&&D.vix.sectors||[]).filter(x=>x.STRESS!=null); if(!S.length)return '<div class="empty">VIX study not built.</div>';
    const defs=[...S].sort((a,b)=>b.STRESS-a.STRESS).slice(0,5), hots=[...S].filter(x=>x.CALM!=null).sort((a,b)=>b.CALM-a.CALM).slice(0,5);
    return '<div class="chips"><span class="note" style="align-self:center;margin:0">when VIX SPIKES, hold up best →</span>'+defs.map(x=>'<span class="sc def">🛡 '+x.sector.slice(0,20)+'</span>').join('')+'</div>'+
      '<div class="chips"><span class="note" style="align-self:center;margin:0">when VIX CALM, biggest up-moves →</span>'+hots.map(x=>'<span class="sc hot">⚡ '+x.sector.slice(0,20)+'</span>').join('')+'</div>'+
      '<table><thead><tr><th>sector</th><th>VIX calm</th><th>elevated</th><th>VIX stress</th><th>β-VIX</th></tr></thead><tbody>'+
      S.slice(0,18).map(x=>'<tr><td>'+x.sector.slice(0,24)+'</td><td class="'+(x.CALM>=0?"pos":"neg")+'">'+x.CALM+'</td><td>'+x.ELEVATED+'</td><td class="'+(x.STRESS>=0?"pos":"neg")+'">'+x.STRESS+'</td><td>'+x.vix_beta+'</td></tr>').join('')+'</tbody></table>'+
      '<div class="note">mean daily % return by VIX regime. β-VIX = sensitivity to VIX daily change (all negative; magnitude = how hard it gets hit when fear rises).</div>';},
  drivers:()=>{const dr=D.vix&&D.vix.drivers; if(!dr)return '<div class="empty">drivers not built.</div>';
    return '<div class="theory" style="margin-bottom:12px"><b>'+dr.attribution+'</b></div>'+
      '<table><thead><tr><th>driver</th><th>corr to VIX</th><th>5d move</th><th>read</th></tr></thead><tbody>'+
      dr.contributions.map(c=>'<tr><td>'+c.driver+(dr.lead.includes(c.driver)?' <span style="color:var(--saffron)">◄ lead</span>':'')+'</td><td>'+c.corr+'</td><td class="'+(c.chg5d>=0?"pos":"neg")+'">'+(c.chg5d!=null?pct(c.chg5d):"—")+'</td><td style="text-align:left;font-family:Inter;font-size:11px;color:var(--muted)">'+c.impact+'</td></tr>').join('')+'</tbody></table>';},
  tiers:()=>{const t=D.tiers; if(!t||!t.tiers)return '<div class="empty">tiers not built.</div>';
    let h=''; for(let i=1;i<=5;i++){const x=t.tiers['T'+i];if(!x)continue;h+='<div class="tier"><div class="tn">'+(i===1?'⚡ ':'')+'Tier '+i+'</div><div class="tv">~'+x.vol_pct+'%/yr · '+x.n+' inds</div><div class="te">'+(x.examples||[]).slice(0,5).join(' · ')+'</div></div>';}
    const ll=t.leadlag&&t.leadlag['T1->T2']; return h+'<div class="note">lead-lag T1→T2: contemp '+(ll?ll.contemp:'—')+' (co-move) vs 1-day '+(ll?ll.lag1:'—')+' — the 1-day lead ≈ market momentum, NOT special propagation. Use tier-1 for amplitude; the <a href="marle_g_cascade.html" style="color:var(--saffron)">cascade</a> graph for real "X→Y follows".</div>';},
  lastcandle:()=>{const r=D.lc&&D.lc.results; if(!r)return '<div class="empty">backtest still running — check back in a minute.</div>';
    const lab={baseline:'any day (baseline)',last_spike:'closing-volume spike alone',confluence_daily:'fib + Ichimoku + U/D (no spike)',full:'full confluence + spike',spike_x_fib:'spike + fib',spike_x_ichi:'spike + Ichimoku'};
    let h='<table><thead><tr><th>signal</th><th>n</th><th>next-day win%</th><th>net%</th></tr></thead><tbody>';
    Object.keys(lab).forEach(k=>{const x=r[k];h+='<tr><td style="text-align:left">'+lab[k]+'</td>'+(x?'<td>'+x.n+'</td><td class="'+(x.win>=50?"pos":"neg")+'">'+x.win+'%</td><td class="'+(x.net>=0?"pos":"neg")+'">'+x.net+'</td>':'<td colspan=3 style="color:var(--dim)">n&lt;30</td>')+'</tr>';});
    return h+'</tbody></table><div class="note">'+(D.lc.caveat||'')+'</div>';},
  macro:()=>{const g=((D.ind&&D.ind.groups)||[]).slice(); if(!g.length)return '<div class="empty">industry RS not built.</div>';
    g.sort((a,b)=>b.ret20-a.ret20); const top=g.slice(0,10), bot=g.slice(-6);
    const row=x=>'<tr><td>'+(x.leading?'🟢 ':'🔴 ')+x.group.slice(0,26)+'</td><td style="color:var(--dim);text-align:left">'+(x.macro||'')+'</td><td class="'+(x.ret20>=0?"pos":"neg")+'">'+pct(x.ret20)+'</td><td>'+x.breadth+'%</td><td>'+(x.rs!=null?x.rs:'—')+'</td></tr>';
    return '<table><thead><tr><th>industry</th><th style="text-align:left">sector</th><th>ret20</th><th>breadth</th><th>RS</th></tr></thead><tbody>'+
      '<tr><td colspan=5 style="color:var(--saffron);text-align:left;font-size:9px;letter-spacing:.05em">▲ LEADING — fish here</td></tr>'+top.map(row).join('')+
      '<tr><td colspan=5 style="color:var(--red);text-align:left;font-size:9px;letter-spacing:.05em">▼ LAGGING — avoid longs</td></tr>'+bot.map(row).join('')+'</tbody></table>'+
      '<div class="note">ret20 in red = the industry is falling — don\'t hunt longs there. 🟢 leaders = top 40% by momentum+breadth. Same rotation read as the rotation pod, here for context.</div>';},
};

/* ---------- deep theory per engine ---------- */
const THEORY={
  squeeze:'<div class="theory"><h4>what a squeeze is</h4>A short squeeze is forced demand: shorts who must buy back as price rises, fuelling more rise. In the US you measure it with public <b>short-interest</b> data (GME, 2021). <b>India publishes no daily equity short-interest</b>, so a literal squeeze isn\'t directly observable.<h4>our India proxy</h4>We infer covering from <b>F&amp;O open interest</b>: price <b>up</b> + OI <b>down</b> = shorts closing positions (<span class="anchor">the covering signature</span>); price up + OI up = fresh long buildup. We add the <b>abnormal-up-after-downtrend</b> footprint (a beaten-down name ripping on volume) — the classic squeeze shape.<h4>the catch</h4>A covering rally is often <b>less durable</b> — once shorts are out, the buying that drove it dries up. Treat it as a burst to ride briefly with a tight stop, not a trend to marry. And our breakout backtest showed a <b>volume blast on the move often signals exhaustion/event, not demand</b> — which is why every candidate is now run through the earnings/news gate (⚠). The radar auto-scans the whole F&amp;O list daily; you never type a ticker.</div>',
  amp:'<div class="theory"><h4>the honest version of "3–8% a day"</h4>Consistent 5%/day on capital is not a real, repeatable edge — so we don\'t promise the <b>outcome</b>. We screen the <b>amplitude</b>: can this name even move that much?<h4>how it\'s measured</h4>• <b>ATR%</b> = average daily range as a % of price. A 1.5%-ATR name can\'t do 5% without a catalyst; a 5%-ATR name does it routinely.<br>• <b>P(≥5% day)</b> = how often it has actually printed a ≥5% move historically — the empirical frequency, not a guess.<h4>the trade-off</h4>Amplitude is <b>symmetric</b> — the name that can +6% can −6%. So HIGH move-potential <b>demands</b> the daily loss-limit and tight sizing (both in the War Room). <span class="anchor">F&amp;O leverage</span> is the realistic path: a 2–3% underlying move on a near-month future or ATM option is already your 6–8% on the position — you don\'t need a 5% cash move.</div>',
  vix:'<div class="theory"><h4>what India VIX is</h4>The 30-day implied volatility of NIFTY options — the market\'s <b>fear gauge</b>. Rising VIX = the market is paying up for protection.<h4>why every sector has negative VIX-beta</h4>When implied vol jumps, the equity risk premium reprices and <b>everything falls</b> — but by different amounts. <span class="anchor">Ang, Hodrick, Xing &amp; Zhang (2006)</span>: high vol-beta assets earn lower returns. High-beta cyclicals (Realty, Metals, IT) have <b>steep</b> negative VIX-beta — crushed when fear spikes, but the biggest gainers when it subsides. Defensives (Pharma, FMCG) have <b>shallow</b> VIX-beta — stable cash flows reprice less.<h4>the conscience (regime-conditional, not blanket de-risking)</h4><span class="anchor">Moreira &amp; Muir (2017)</span> vol-managed portfolios scale down when vol is high — but in India\'s structural up-drift, blanket vol-management <b>backfired</b> in our tests. The nuance that works: <b>VIX calm → fish high-beta for the 3–8% amplitude; VIX spiking → rotate to defensives or cash.</b> Same names, opposite role depending on the regime.</div>',
  drivers:'<div class="theory"><h4>why bother attributing the move</h4>"VIX is up" is useless without "why" — the <b>driver</b> tells you which industries to lean long vs short.<h4>what we found</h4>India VIX is <b>mostly a LOCAL fear gauge</b> — it tracks NIFTY itself far more (ρ≈−0.63) than any global series. So step one when VIX rises: <b>is NIFTY selling off (local), or is a global/commodity shock leading?</b> US VIX and crude are secondary (ρ≈0.14–0.17).<h4>the industry map</h4><ul><li><b>Crude ↑</b> → OMCs / aviation / paints / tyres / logistics hurt (input cost); upstream (ONGC, Oil India) benefit.</li><li><b>Weak rupee (USDINR ↑)</b> → IT &amp; pharma <b>exporters</b> benefit; oil importers &amp; capital goods hurt.</li><li><b>US VIX ↑ (global risk-off)</b> → high-beta &amp; midcaps hit hardest; exporters cushioned.</li></ul><span class="anchor">News headlines</span> — the qualitative "why" — we can\'t read reliably from a US IP, so the quantitative attribution is the honest substitute.</div>',
  tiers:'<div class="theory"><h4>tiering by volatility</h4>Industries ranked into 5 tiers by annualized vol. <b>Tier-1 (~32%/yr: Capital Goods, Defense, Renewables, Fertilizers)</b> is high-beta, sentiment-driven, smaller-cap-heavy — <b>where the 3–8% amplitude lives</b> (and the biggest drawdowns).<h4>your "tier-2 follows tier-1" hypothesis — tested</h4>Intuitive, but <b>mostly false in liquid markets.</b> Our lead-lag test: tier-1 yesterday → tier-2 today correlation is <b>~0.13 — identical to tier-1\'s own autocorrelation and the reverse (T2→T1).</b> That means it\'s <b>generic 1-day market momentum, not a tier-specific propagation</b> you can trade. (There\'s a faint echo — after a big tier-1 up-day the market drifts +0.67%/3d — but that\'s "buy strength," not "tier-2 follows.")<h4>where propagation actually lives</h4>Real, tradeable "X moves → Y follows" is between <b>specifically linked</b> industries — oil → OMC → paint — via supply-chain/input-output links and Granger tests. That\'s the <span class="anchor">Cascade engine</span>, not broad vol tiers. <span class="anchor">Moskowitz &amp; Grinblatt (1999)</span> industry momentum is real; cross-tier lead-lag is not. <b>Use tiers as your amplitude/risk map; use the cascade graph for propagation.</b></div>',
  lastcandle:'<div class="theory"><h4>the idea</h4>The <b>closing auction / final candle</b> is where benchmark-tracking and institutional MOC flow concentrate. A surge of volume into the close <i>could</i> signal informed positioning that carries into the next session.<h4>what we already knew (and why we doubted it)</h4>Our micro-structure work found <b>closing pressure MEAN-REVERTS</b> — the last move tends to <b>reverse</b>, not continue (close-location-value inverts at the micro-horizon). So a naive "buy the closing spike" loses.<h4>this test</h4>We ask whether a closing-volume spike, <b>gated by the bullish daily confluence</b> (fib &gt; 0.618 + above the Ichimoku cloud &amp; Kijun + U/D ratio rising), flips that into a continuation edge — and compare it to each piece alone. The "live analysis" tab has the win ratios.<h4>honest caveat</h4>Intraday history is <b>shallow (~40–60 sessions)</b>, so samples are small and this is <b>indicative, not 5y-grade</b>. Treat any edge here as a hypothesis to watch, not a rule to bet the book on. <span class="anchor">Ichimoku</span> (Hosoda) and the closing-auction literature motivate it; the data decides.</div>',
};

    ".doss-ov.show{display:flex}.doss{background:var(--card);border:1px solid var(--saffron);border-radius:16px;max-width:880px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.6)}"+

    ".doss-h .nm{font-weight:800;font-size:18px}.doss-h .nm .cmp{font-family:Inter;font-size:11px;color:var(--dim);font-weight:400;margin-left:8px}"+
    ".doss-h .x{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer}.doss-h .x:hover{color:var(--ink);border-color:var(--saffron)}"+
    ".doss-b{padding:16px 20px 22px}.dgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}@media(max-width:760px){.dgrid{grid-template-columns:1fr}}"+
    ".tile{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:9px}"+
    ".tile .l{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}.tile .v{font-family:var(--mono);font-weight:800;font-size:15px;margin-top:3px}.tile .s{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}"+
    ".cmpx{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;padding:3px 0}.cmpx .b{width:16px;text-align:center}";
  document.head.appendChild(st);

  ov.innerHTML='<div class="doss"><div class="doss-h"><div class="nm" id="doss-nm">…</div><div class="x" onclick="closeDossier()">✕ close</div></div><div class="doss-b" id="doss-body"><div class="empty">loading dossier…</div></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){ if(e.target===ov) closeDossier(); });

window.closeDossier=function(){ document.getElementById('doss-ov').classList.remove('show'); };
window.openDossier=async function(sym){
  var ov=document.getElementById('doss-ov'); ov.classList.add('show');
  document.getElementById('doss-nm').textContent=sym;
  document.getElementById('doss-body').innerHTML='<div class="empty">crunching '+sym+' — Monte Carlo + conviction…</div>';
  var d=await jget('/api/dossier/'+encodeURIComponent(sym));
  if(!d||!d.ok){ document.getElementById('doss-body').innerHTML='<div class="empty">'+((d&&d.error)||'no data for '+sym)+'</div>'; return; }
  document.getElementById('doss-nm').innerHTML=d.s+' <span class="cmp">'+(d.name||'')+' · '+(d.sector||'')+'</span>';
  document.getElementById('doss-body').innerHTML=dossBody(d);
};
function meter(cv){
  var col=cv.label==='HIGH'?'var(--green)':cv.label==='MEDIUM'?'var(--amber)':'var(--red)';
  return '<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px"><div style="font-family:var(--mono);font-weight:800;font-size:32px;color:'+col+'">'+cv.score+'<span style="font-size:13px;color:var(--dim)">/100</span></div>'+
    '<div style="flex:1"><div style="font-family:var(--mono);font-weight:800;color:'+col+'">'+cv.label+' CONVICTION</div>'+
    '<div style="height:9px;border-radius:6px;background:rgba(255,255,255,.07);margin-top:6px;overflow:hidden"><span style="display:block;height:100%;width:'+cv.score+'%;background:'+col+'"></span></div>'+
    (cv.capped?'<div class="note" style="color:var(--red);margin-top:5px">⚠ '+cv.capped+'</div>':'')+'</div></div>';
}
function dossBody(d){
  var cv=d.conviction, a=d.suggested, mp=d.move_potential, sq=d.squeeze_ceiling, mc=d.montecarlo, lv=d.levels;
  var acol=a.action==='LONG'?'var(--green)':a.action==='WATCH'?'var(--amber)':'var(--red)';
  var ov=d.overlap;
  var left='<div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px">'+d.direction+'</div>'+chartSVG(d);
  var right=meter(cv)+
    '<div style="border:1px solid '+acol+';border-radius:10px;padding:11px 13px;margin:10px 0;background:rgba(255,255,255,.02)"><div style="font-family:var(--mono);font-weight:800;color:'+acol+'">▶ '+a.action+'</div><div style="font-size:12px;color:var(--ink);margin-top:5px;line-height:1.5">'+a.text+'</div></div>'+
    (ov&&ov.warn?'<div style="border:1px solid var(--amber);border-radius:9px;padding:9px 11px;margin-bottom:9px;font-size:11.5px;color:var(--amber)">'+ov.msg+'</div>':(ov?'<div class="note">✓ '+ov.msg+'</div>':''))+
    '<div class="tile"><div class="l">squeeze ceiling (how high it can run)</div><div class="v">₹'+sq.resistance+' <span style="font-size:11px;color:var(--green)">+'+sq.room_pct+'% room</span></div><div class="s">MC 10d p95 ₹'+(sq.mc_p95_10d||'—')+' · '+sq.note+'</div></div>'+
    '<div class="tile"><div class="l">move-potential (daily amplitude)</div><div class="v"><span class="mp '+mp.tag+'">'+mp.tag+'</span> ATR% '+mp.atrp+'</div><div class="s">printed ≥5% on '+mp.p5+'% of days · exp day ₹'+mp.exp_lo+'–'+mp.exp_hi+'</div></div>'+
    (mc?'<div class="tile"><div class="l">monte carlo (10d, from recent vol)</div><div class="v" style="font-size:13px">P(+5%) '+mc.p_up5+'% · P(+8%) '+mc.p_up8+'% · P(−5%) '+mc.p_dn5+'%</div><div class="s">median ₹'+mc.exp+' · band ₹'+mc.p05+'–₹'+mc.p95+'</div></div>':'');
  var comps='<div style="margin-top:14px"><div class="note" style="margin:0 0 6px">conviction breakdown — what\'s firing:</div>'+
    cv.components.map(function(c){return '<div class="cmpx"><span class="b" style="color:'+(c.ok?'var(--green)':'var(--red)')+'">'+(c.ok?'✓':'✗')+'</span><span style="color:'+(c.ok?'var(--ink)':'var(--dim)')+'">'+c.k+'</span><span style="color:var(--dim);margin-left:auto">'+c.pts+'/'+c.max+' — '+c.why+'</span></div>';}).join('')+'</div>';
  return '<div class="dgrid"><div>'+left+'</div><div>'+right+'</div></div>'+comps+
    '<div style="margin-top:12px"><button class="ctrl" style="font-family:var(--mono);font-size:11px;color:var(--saffron);background:transparent;border:1px solid var(--saffron);border-radius:8px;padding:7px 13px;cursor:pointer" onclick="window.openStock&&openStock(\''+d.s+'\')">📊 full chart & financials</button></div>';
}
function chartSVG(d){
  var hist=d.hist||[], mc=d.montecarlo, lv=d.levels||{}; if(!hist.length) return '<div class="empty">no chart data</div>';
  var W=680,H=290,padL=8,padR=58,padT=14,padB=16, cone=(mc&&mc.cone)||[], N=hist.length, C=cone.length, total=N+C;
  var vals=hist.map(function(x){return x.c;}); cone.forEach(function(c){vals.push(c.p5,c.p95);});
  [lv.support,lv.resistance,lv.stop,lv.target,lv.price].forEach(function(v){if(v)vals.push(v);});
  var yMin=Math.min.apply(null,vals), yMax=Math.max.apply(null,vals); var p=(yMax-yMin)*0.06||1; yMin-=p; yMax+=p;
  var X=function(i){return padL+(i/(total-1))*(W-padL-padR);}, Y=function(v){return padT+(1-(v-yMin)/(yMax-yMin))*(H-padT-padB);};
  var hp='M '+hist.map(function(x,i){return X(i).toFixed(1)+' '+Y(x.c).toFixed(1);}).join(' L ');
  var ax=N-1, ay=lv.price||hist[N-1].c, up=[[X(ax),Y(ay)]],lo=[[X(ax),Y(ay)]],u2=[[X(ax),Y(ay)]],l2=[[X(ax),Y(ay)]],mid=[[X(ax),Y(ay)]];
  cone.forEach(function(c,j){var xi=X(N+j); up.push([xi,Y(c.p95)]);lo.push([xi,Y(c.p5)]);u2.push([xi,Y(c.p75)]);l2.push([xi,Y(c.p25)]);mid.push([xi,Y(c.p50)]);});
  var poly=function(a,b){return a.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')+' '+b.slice().reverse().map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');};
  var ln=function(a){return 'M '+a.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' L ');};
  var lvl=function(v,col,dash,lbl){return v?('<line x1="'+padL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(v).toFixed(1)+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="'+dash+'" opacity=".75"/><text x="'+(W-padR+3)+'" y="'+(Y(v)+3).toFixed(1)+'" fill="'+col+'" font-size="9">'+lbl+' '+v+'</text>'):'';};
  var nowX=X(N-1);
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+
    '<polygon points="'+poly(up,lo)+'" fill="rgba(255,153,51,.09)"/><polygon points="'+poly(u2,l2)+'" fill="rgba(255,153,51,.17)"/>'+
    '<path d="'+ln(mid)+'" fill="none" stroke="var(--saffron)" stroke-width="1.3" stroke-dasharray="4 3"/>'+
    '<path d="'+hp+'" fill="none" stroke="var(--ink)" stroke-width="1.7"/>'+
    '<line x1="'+nowX.toFixed(1)+'" y1="'+padT+'" x2="'+nowX.toFixed(1)+'" y2="'+(H-padB)+'" stroke="rgba(255,255,255,.2)" stroke-dasharray="2 3"/><text x="'+nowX.toFixed(1)+'" y="'+(padT-3)+'" fill="var(--dim)" font-size="8" text-anchor="middle">now</text>'+
    lvl(lv.resistance,'var(--red)','5 4','R')+lvl(lv.target,'var(--green)','1 3','tgt')+lvl(lv.support,'var(--green)','5 4','S')+lvl(lv.stop,'var(--red)','1 3','stop')+
    '<circle cx="'+nowX.toFixed(1)+'" cy="'+Y(ay).toFixed(1)+'" r="3.3" fill="var(--ink)"/></svg>'+
    '<div class="note" style="margin-top:3px">white = 60d price · saffron fan = 10-day Monte-Carlo cone (light p5–p95, dark p25–p75, dashed median) · dashed lines = support/resistance/stop/target. The cone is a distribution from recent volatility — not a forecast.</div>';
}
