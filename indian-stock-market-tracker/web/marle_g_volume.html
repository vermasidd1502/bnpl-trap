<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume Pod · Marle-G</title>
<style>
  :root{ --bg:#080a0e;--bg2:#0e1116;--card:#14171e;--border:rgba(255,255,255,.08);
    --ink:#eef1f6;--muted:#9aa3b4;--dim:#646c7a;--mono:'SF Mono',ui-monospace,Consolas,monospace;
    --saffron:#ff9933;--india-green:#138808;--green:#22c55e;--red:#ef4444;--amber:#fbbf24;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1100px 520px at 50% -10%,rgba(255,153,51,.05),transparent 60%),var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--border);background:rgba(8,10,14,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .brand{font-family:var(--mono);font-weight:800;letter-spacing:.18em;font-size:13px;display:flex;align-items:center;gap:9px}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--saffron),var(--india-green))}
  .brand .w{background:linear-gradient(90deg,var(--saffron),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabs{display:flex;gap:16px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
  .tabs a{color:var(--dim);text-decoration:none} .tabs a.on{color:var(--saffron)} .tabs a:hover{color:var(--ink)}
  .preview-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--saffron);border:1px solid var(--saffron);border-radius:5px;padding:3px 7px}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 24px 70px}
  .head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .head h1{font-size:22px;font-weight:800} .head .sub{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .bar2{display:flex;gap:10px;align-items:center;margin:14px 0 18px;flex-wrap:wrap}
  .bar2 input{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:11px 14px;font-family:var(--mono);font-size:13px}
  .seg{display:flex;gap:6px} .seg button{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer}
  .seg button.on{background:var(--saffron);color:#160f02;border-color:var(--saffron);font-weight:700}
  .legend{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:16px}
  .legend b.g{color:var(--green)} .legend b.r{color:var(--red)}
  .sector{background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:11px;overflow:hidden}
  .sh{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;user-select:none}
  .sh:hover{background:rgba(255,255,255,.02)}
  .sh .nm{font-size:15px;font-weight:700;min-width:160px}
  .sh .udwrap{flex:1;display:flex;align-items:center;gap:10px;max-width:340px}
  .sh .track{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden}
  .sh .track span{display:block;height:100%;border-radius:6px}
  .sh .udn{font-family:var(--mono);font-size:14px;font-weight:800;width:52px;text-align:right}
  .sh .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto;text-align:right}
  .sh .caret{color:var(--dim);font-family:var(--mono);transition:transform .15s} .sector.open .caret{transform:rotate(90deg)}
  .body{display:none;border-top:1px solid var(--border)} .sector.open .body{display:block}
  .ind{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--saffron);font-weight:700;padding:10px 18px 4px;background:rgba(255,153,51,.04)}
  table{width:100%;border-collapse:collapse}
  th{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:right;padding:6px 18px;font-weight:600}
  th:first-child{text-align:left}
  td{padding:9px 18px;font-size:13px;border-top:1px solid rgba(255,255,255,.03);text-align:right;font-family:var(--mono)}
  td:first-child{text-align:left}
  tr.stk{cursor:pointer} tr.stk:hover{background:rgba(255,153,51,.07)}
  .sym{font-weight:700;color:var(--ink)} .cmp{color:var(--dim);font-size:11px;margin-left:8px}
  .udcell{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}
  .udcell .t{width:70px;height:7px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden}
  .udcell .t span{display:block;height:100%}
  .pos{color:var(--green)} .neg{color:var(--red)} .neu{color:var(--amber)}
  .empty{text-align:center;color:var(--muted);padding:50px}
  .addb{font-family:var(--mono);font-size:11px;color:var(--saffron);background:var(--bg2);border:1px solid var(--saffron);border-radius:8px;padding:8px 12px;cursor:pointer}
  #addform{background:var(--card);border:1px solid var(--saffron);border-radius:12px;padding:14px;margin-bottom:14px}
  #gatedpanel{background:var(--card);border:1px solid var(--green);border-radius:12px;padding:14px;margin-bottom:14px}
  .gatedb{font-family:var(--mono);font-size:11px;color:var(--green);background:var(--bg2);border:1px solid var(--green);border-radius:8px;padding:8px 12px;cursor:pointer}
  .af-f{display:flex;flex-direction:column;gap:4px}
  .af-f label{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
  .af-f input,.af-f select{background:var(--bg2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12px;min-width:160px}
  .af-go{background:linear-gradient(135deg,var(--saffron),var(--india-green));color:#0a0b0f;font-weight:800;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:var(--mono);font-size:12px;height:35px}
  .edit{margin-left:8px;color:var(--dim);cursor:pointer;font-size:11px}.edit:hover{color:var(--saffron)}
  .vb{font-family:var(--mono);font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:5px}
  .vb.LONG{background:rgba(34,197,94,.18);color:var(--green)} .vb.SHORT{background:rgba(239,68,68,.18);color:var(--red)} .vb.FLAT{background:rgba(255,255,255,.06);color:var(--dim)}
  .tgt{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px}
  .cons{font-weight:800;font-family:var(--mono)}
  .dbadge{font-family:var(--mono);font-size:9px;font-weight:800;color:var(--green);border:1px solid rgba(34,197,94,.4);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
  .dbadge.new{color:var(--saffron);border-color:rgba(255,153,51,.4)}
</style>
</head>
<body>
<div class="nav">
  <div class="brand"><span class="mark"></span><span>MARLE<span class="w">·G</span></span></div>
  <div class="tabs">
    <a href="marle_g_pod.html">home</a><a href="marle_g_equity.html">equity</a><a href="marle_g_volume.html" class="on">volume</a><a href="marle_g_options.html">options</a><a href="marle_g_funds.html">funds</a><a href="marle_g_portfolio.html">portfolio</a><a href="marle_g_macro_preview.html">macro</a><a href="marle_g_dashboard.html">dashboard</a><a href="marle_g_profile.html">profile</a>
  </div>
  <span class="preview-tag">PREVIEW</span>
</div>

<main class="wrap">
  <div class="head"><h1>Volume Pod</h1><span class="sub" id="sub"></span></div>
  <div class="bar2">
    <input id="q" placeholder="filter the list by symbol or company…" spellcheck="false" data-no-suggest>
    <div class="seg"><button id="byud" class="on" onclick="setSort('ud')">sort: U/D</button><button id="byrvol" onclick="setSort('rvol')">RVOL</button></div>
    <button class="gatedb" onclick="toggleGated()">🎯 Gated longs</button>
    <button class="gatedb" onclick="toggleTransition()" style="border-color:var(--amber);color:var(--amber)">🔀 Transition watch</button>
    <button class="addb" onclick="toggleAdd()">➕ Add / edit stock</button>
  </div>
  <div class="legend">Up/Down volume ratio over 20 sessions &nbsp;·&nbsp; <b class="g">≥1.5 accumulation</b> &nbsp; <b class="r">≤0.7 distribution</b> &nbsp;·&nbsp; sectors ranked by median U/D &nbsp;·&nbsp; click a stock for full analysis</div>
  <style>
  @keyframes mgshim{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .vs-row{border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-bottom:7px;overflow:hidden;background-size:200% 100%;animation:mgshim 3.6s linear infinite;display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer}
  .vs-row.gold{background-image:linear-gradient(110deg,rgba(255,193,7,.05),rgba(255,193,7,.28),rgba(255,193,7,.05));border-color:rgba(255,193,7,.55)}
  .vs-row.green{background-image:linear-gradient(110deg,rgba(34,197,94,.04),rgba(34,197,94,.20),rgba(34,197,94,.04));border-color:rgba(34,197,94,.40)}
  .vs-row.red{background-image:linear-gradient(110deg,rgba(239,68,68,.04),rgba(239,68,68,.17),rgba(239,68,68,.04));border-color:rgba(239,68,68,.32)}
  .vs-sym{font-weight:800;font-size:14px;min-width:100px}
  .vs-ud{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.05)}
  .vs-h{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--saffron);font-weight:800;margin:15px 0 9px}
  </style>
  <div id="vstate"><div style="color:var(--dim);font-family:var(--mono);font-size:12px;padding:6px 0">loading the live state board…</div></div>

  <div id="addform" style="display:none">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
      <div class="af-f"><label>Symbol</label><input id="af-sym" placeholder="e.g. ETERNAL" spellcheck="false"></div>
      <div class="af-f"><label>Sector</label><select id="af-sec" onchange="afSecChange()"></select></div>
      <div class="af-f" id="af-newsec-wrap" style="display:none"><label>New sector</label><input id="af-newsec" placeholder="new sector name"></div>
      <div class="af-f"><label>Industry (sub-sector)</label><select id="af-ind" onchange="afIndChange()"></select></div>
      <div class="af-f" id="af-newind-wrap" style="display:none"><label>New industry</label><input id="af-newind" placeholder="new sub-sector name"></div>
      <button class="af-go" onclick="afSubmit()">Add / Update</button>
    </div>
    <div id="af-msg" style="font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:9px"></div>
  </div>
  <div id="gatedpanel" style="display:none"></div>
  <div id="transitionpanel" style="display:none"></div>
  <div id="out"></div>
</main>

<script src="marleg_stockmodal.js"></script>
<script>
const $=id=>document.getElementById(id);
let DATA={sectors:[]}, SORT='ud', Q='';
const udcolor=u=>u>=1.5?'var(--green)':u<=0.7?'var(--red)':'var(--amber)';
const cls=x=>x>0?'pos':x<0?'neg':'neu';
const pct=x=>(x>0?'+':'')+(+x).toFixed(2)+'%';
let FUND={};
function fundCell(sym){
  const f=FUND[sym]; if(!f||!('q' in f)) return '<span style="color:var(--dim)">—</span>';
  const qc=f.q>=70?'var(--green)':f.q>=45?'var(--amber)':'var(--red)';
  return `<span style="font-size:10px"><b style="color:${qc}">Q${f.q==null?'—':f.q}</b> · PE ${f.pe==null?'—':f.pe} · ROE ${f.roe==null?'—':f.roe+'%'}</span>`;
}
let HYDRATING=false;
async function hydrateFundamentals(syms){
  const need=syms.filter(s=>{const f=FUND[s]; return (!f || f.q==null) && !(f&&f.err);});
  if(!need.length||HYDRATING) return;
  HYDRATING=true;
  const sub=$('sub'), prev=sub.textContent;
  sub.textContent='⟳ hardcore-fetching fundamentals: '+need.slice(0,8).join(', ')+'…';
  for(const s of need.slice(0,8)){
    try{
      const f=await (await fetch('/api/fundamentals/'+encodeURIComponent(s))).json();
      if(f && !f.error && f.qscore!=null){ const h=f.health||{}; FUND[s]={q:f.qscore, pe:h['P/E'], roe:h['ROE'], growth:h['Rev growth'], cov:f.coverage}; }
      else FUND[s]={err:1};   // no statement data (sparse/throttled) — mark tried so we don't loop; page reload retries
    }catch(e){ FUND[s]={err:1}; }
  }
  HYDRATING=false; sub.textContent=prev; render();
}

async function load(){
  try{const r=await fetch('/api/volume_pod');DATA=await r.json();}catch(e){DATA={sectors:[]};}
  try{FUND=await (await fetch('/api/fundamentals_cache')).json()||{};}catch(e){FUND={};}
  const _fn=Object.values(FUND).filter(v=>v&&'q' in v).length;
  $('sub').textContent=DATA.error?DATA.error:`${DATA.universe||0} stocks · ${(DATA.sectors||[]).length} sectors · fundamentals cached ${_fn} · as of ${DATA.asof||'—'}`;
  render();
}
function setSort(s){SORT=s;$('byud').classList.toggle('on',s==='ud');$('byrvol').classList.toggle('on',s==='rvol');render();}
$ && ($('q')?.addEventListener('input',e=>{Q=e.target.value.trim().toUpperCase();render();}));

function render(){
  const sectors=(DATA.sectors||[]).map(sec=>{
    let stocks=sec.stocks.filter(s=>!Q||s.s.includes(Q)||(s.n||'').toUpperCase().includes(Q));
    stocks=stocks.slice().sort((a,b)=> SORT==='rvol'?((b.rvol||0)-(a.rvol||0)):(b.ud-a.ud));
    return {...sec,_stocks:stocks};
  }).filter(sec=>sec._stocks.length);
  if(!sectors.length){$('out').innerHTML=`<div class="empty">${DATA.error||'No matches.'}</div>`;return;}
  const openAll=!!Q;
  $('out').innerHTML=sectors.map((sec,i)=>{
    const w=Math.max(4,Math.min(100,sec.ud/3*100));
    // group stocks by industry
    const byInd={}; sec._stocks.forEach(s=>{(byInd[s.industry]=byInd[s.industry]||[]).push(s);});
    const inds=Object.entries(byInd).sort((a,b)=>b[1].length-a[1].length);
    const rows=inds.map(([ind,list])=>`
      <div class="ind">${ind} · ${list.length}</div>
      <table><thead><tr><th>Symbol</th><th>U/D</th><th>RVOL</th><th>Chg</th><th>Price</th><th>Q·PE·ROE</th><th>Bias · target</th></tr></thead><tbody>
      ${list.map(s=>`<tr class="stk" onclick="openStock('${s.s}')">
        <td><span class="sym">${s.s}</span><span class="cmp">${s.n||''}</span><span class="edit" title="open interactive chart" onclick="event.stopPropagation();location.href='marle_g_chart.html?q=${s.s}'">📈</span><span class="edit" title="edit sector/industry" onclick="event.stopPropagation();editStock('${s.s}','${sec.sector}','${(s.industry||'').replace(/'/g,'')}')">✎</span></td>
        <td><span class="udcell"><span class="t"><span style="width:${Math.max(4,Math.min(100,s.ud/3*100))}%;background:${udcolor(s.ud)}"></span></span><b style="color:${udcolor(s.ud)}">${s.ud}</b></span></td>
        <td>${s.rvol==null?'—':s.rvol+'×'}</td>
        <td class="${cls(s.chg)}">${pct(s.chg)}</td>
        <td>₹${(s.price||0).toLocaleString('en-IN')}</td>
        <td>${fundCell(s.s)}</td>
        <td><span class="vb ${s.verdict||'FLAT'}">${s.verdict||'—'}</span>${s.target?`<div class="tgt">→ ₹${s.target.toLocaleString('en-IN')} (${s.tgtpct>0?'+':''}${s.tgtpct}%)</div>`:''}</td></tr>`).join('')}
      </tbody></table>`).join('');
    return `<div class="sector${openAll||i===0?' open':''}">
      <div class="sh" onclick="this.parentNode.classList.toggle('open')">
        <span class="caret">▶</span>
        <span class="nm">${sec.sector}</span>
        <span class="udwrap"><span class="track"><span style="width:${w}%;background:${udcolor(sec.ud)}"></span></span><span class="udn" style="color:${udcolor(sec.ud)}">${sec.ud}</span></span>
        <span class="meta">${sec.consensus?`<span class="cons" style="color:${sec.consensus==='LONG'?'var(--green)':sec.consensus==='SHORT'?'var(--red)':'var(--amber)'}">▸ ${sec.consensus}</span> ${sec.longs||0}L/${sec.shorts||0}S · `:''}${sec._stocks.length} stk · ${sec.strong} strong</span>
      </div>
      <div class="body">${rows}</div>
    </div>`;
  }).join('');
  // focused search -> go hardcore: fetch full fundamentals live for the few visible names
  if(Q){ const vis=sectors.flatMap(s=>s._stocks.map(x=>x.s)); if(vis.length && vis.length<=8) hydrateFundamentals(vis); }
}
// ---- add / edit stocks (features: choose existing or create new sector/industry) ----
function taxonomy(){ const t={}; (DATA.sectors||[]).forEach(sec=>{ t[sec.sector]=t[sec.sector]||new Set(); sec.stocks.forEach(s=>t[sec.sector].add(s.industry)); }); return t; }
function opt(v,sel){ return `<option ${v===sel?'selected':''}>${v}</option>`; }
function populateSectors(selSec,selInd){
  const t=taxonomy(), secs=Object.keys(t).filter(s=>s!=='Others').sort();
  $('af-sec').innerHTML = secs.map(s=>opt(s,selSec)).join('') + opt('Others',selSec) + '<option value="__new">➕ New sector…</option>';
  if(selSec==='__new') $('af-sec').value='__new';
  afSecChange(selInd);
}
function afSecChange(selInd){
  const sec=$('af-sec').value;
  $('af-newsec-wrap').style.display = sec==='__new'?'block':'none';
  const inds = sec==='__new' ? [] : [...(taxonomy()[sec]||[])].sort();
  $('af-ind').innerHTML = inds.map(i=>opt(i,selInd)).join('') + '<option value="__new">➕ New industry…</option>';
  afIndChange();
}
function afIndChange(){ $('af-newind-wrap').style.display = $('af-ind').value==='__new'?'block':'none'; }
function toggleAdd(){ const f=$('addform'); const sh=f.style.display==='none'; f.style.display=sh?'block':'none'; if(sh) populateSectors(); }
function editStock(sym,sec,ind){ $('addform').style.display='block'; $('af-sym').value=sym; populateSectors(sec,ind); window.scrollTo(0,0); }
async function afSubmit(){
  const sym=$('af-sym').value.trim().toUpperCase();
  if(!sym){ $('af-msg').textContent='enter a symbol'; return; }
  let sector=$('af-sec').value; if(sector==='__new') sector=$('af-newsec').value.trim();
  let industry=$('af-ind').value; if(industry==='__new') industry=$('af-newind').value.trim();
  sector=sector||'Others'; industry=industry||sector;
  $('af-msg').textContent='saving '+sym+'…';
  try{
    const r=await fetch('/api/volume_pod/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:sym,sector,industry})});
    const j=await r.json();
    $('af-msg').textContent = j.error ? ('error: '+j.error) : (j.warn ? (sym+': '+j.warn) : (sym+' → '+sector+' / '+industry+'  ✓'));
    if(!j.error) await load();
  }catch(e){ $('af-msg').textContent='failed'; }
}
// ---- gated longs (O'Neil/CAN-SLIM confluence: leading sector + U/D>MA & rising + price>0.618 fib) ----
function gatedTenure(p){
  if(!p.days_on_list){ return '<span style="color:var(--dim)">—</span>'; }
  if(p.new_today){ return '<span style="color:var(--dim);font-size:10px">🆕 new today</span>'; }
  const col=p.days_on_list>=3?'var(--saffron)':'var(--amber)';
  const tot=p.total_days&&p.total_days>p.days_on_list?` <span style="color:var(--dim)">(${p.total_days} total)</span>`:'';
  return `<span style="color:${col};font-weight:700;font-size:11px">🔥 day ${p.days_on_list}</span>`+
         `<span style="color:var(--dim);font-size:9.5px"> · since ${p.on_since||'—'}</span>${tot}`;
}
function toggleTransition(){ const f=$('transitionpanel'); const sh=f.style.display==='none'; f.style.display=sh?'block':'none'; if(sh) loadTransition(); }
async function loadTransition(){
  const f=$('transitionpanel');
  const box=s=>'<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px">'+s+'</div>';
  f.innerHTML=box('<span style="color:var(--dim);font-family:var(--mono);font-size:12px">⟳ scoring your longs (mood ✕ Ichimoku ✕ U/D ✕ RSI)… ~10s</span>');
  try{
    const d=await (await fetch('/api/transition')).json();
    if(!d.rows||!d.rows.length){ f.innerHTML=box('<span style="color:var(--dim)">no held longs to watch (or no data right now)</span>'); return; }
    const sc=st=>st==='LONG'?'var(--green)':st==='SHORT-LEAN'?'var(--red)':st==='WEAKENING'?'var(--amber)':'var(--dim)';
    const rows=d.rows.map(r=>{const t=r.transition||{}; const ic=(r.components||{}).ichimoku||'—';
      return `<tr class="stk" onclick="openStock('${r.tk}')" ${t.big?'style="background:rgba(251,191,36,.08)"':''}>
        <td><span class="sym">${r.tk}</span></td>
        <td><b style="color:${sc(r.state)}">${r.state}</b> <span style="color:var(--dim);font-size:9px">${r.score>0?'+':''}${r.score}</span></td>
        <td style="color:${t.big?'var(--red)':'var(--dim)'};font-weight:${t.big?'800':'400'};font-size:10.5px">${t.label||''}</td>
        <td>${r.mood==null?'—':r.mood}</td>
        <td style="color:${r.above_cloud?'var(--green)':r.below_cloud?'var(--red)':'var(--amber)'}">${ic}</td>
        <td>${r.ud==null?'—':r.ud}</td>
        <td style="color:${(r.rsi>72||r.rsi<42)?'var(--red)':'var(--ink)'}">${r.rsi==null?'—':r.rsi}</td></tr>`;}).join('');
    f.innerHTML=box(`<div class="sh" style="color:var(--amber)">🔀 TRANSITION WATCH · your longs · baseline ${d.baseline_from||'(first run sets the baseline)'}</div>
      <div style="font-family:var(--mono);font-size:9.5px;color:var(--dim);margin:-4px 0 10px">composite = mood ✕ Ichimoku (cloud) ✕ U/D ✕ RSI. A holding that was LONG and is now WEAKENING/SHORT = ⚠ <b>the big signal</b> (thesis rolling over → tighten / exit).</div>
      <table><thead><tr><th>Stock</th><th>State</th><th>Transition</th><th>mood</th><th>Ichimoku</th><th>U/D</th><th>RSI</th></tr></thead><tbody>${rows}</tbody></table>`);
  }catch(e){ f.innerHTML=box('<span class="neg">backend offline?</span>'); }
}
function toggleGated(){ const f=$('gatedpanel'); const sh=f.style.display==='none'; f.style.display=sh?'block':'none'; if(sh) loadGated(); }
let GATEDMODE='daily', GSTRICT=false;
function setGatedMode(m){ GATEDMODE=m; loadGated(); }
function setGatedStrict(v){ GSTRICT=v; loadGated(); }
function gtogBtn(m,label){ const on=GATEDMODE===m;
  return `<button onclick="setGatedMode('${m}')" style="font-family:var(--mono);font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;border:1px solid ${on?'var(--green)':'var(--border)'};background:${on?'var(--green)':'var(--bg2)'};color:${on?'#0a0b0f':'var(--muted)'}">${label}</button>`; }
async function loadGated(){
  const f=$('gatedpanel');
  const sb=`<button onclick="setGatedStrict(${!GSTRICT})" title="hide names with an earnings/news/spike footprint" style="font-family:var(--mono);font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer;margin-left:auto;border:1px solid ${GSTRICT?'var(--saffron)':'var(--border)'};background:${GSTRICT?'var(--saffron)':'var(--bg2)'};color:${GSTRICT?'#0a0b0f':'var(--muted)'}">🔒 strict (news-clean)${GSTRICT?' ✓':''}</button>`;
  const toggle=`<div style="display:flex;gap:6px;margin-bottom:10px;align-items:center">${gtogBtn('daily','📅 Daily · swing')}${gtogBtn('hourly','⚡ Hourly · intraday')}${sb}</div>`;
  f.innerHTML=toggle+'<span style="color:var(--dim);font-family:var(--mono);font-size:12px">⟳ loading '+GATEDMODE+' gated list…</span>';
  try{
    const d=await (await fetch('/api/gated?mode='+GATEDMODE)).json();
    if(d.error){ f.innerHTML=toggle+'<div style="color:var(--dim);font-family:var(--mono);font-size:12px;padding:8px">'+d.error+(GATEDMODE==='hourly'?' — the hourly scan runs once an hour during market hours; check back shortly.':'')+'</div>'; return; }
    const note = GATEDMODE==='daily'
      ? `<div style="font-family:var(--mono);font-size:9.5px;color:var(--dim);margin:-4px 0 8px">🔥 <b>on list</b> = consecutive days re-qualified (daily snapshot). A multi-day streak is stickier than a one-day flash.</div>`
      : `<div style="font-family:var(--mono);font-size:9.5px;color:var(--dim);margin:-4px 0 8px">⚡ intraday view — recomputed hourly on the latest bar. Day-streak tenure lives on the Daily list.</div>`;
    const pk = GSTRICT ? (d.picks||[]).filter(x=>x.clean!==false) : (d.picks||[]);
    const flagChip = p => (p.event_flags&&p.event_flags.length)
      ? ` <span title="event-driven — ${p.event_flags.join(' · ')}" style="color:var(--amber);font-size:9px;font-weight:700">⚠</span>`
      : (p.clean!==false ? ` <span title="organic / news-clean" style="color:var(--green);font-size:9px">🔒</span>` : '');
    const longs = pk.length?`<table><thead><tr><th>Symbol</th><th>On list</th><th>Industry · rank</th><th>U/D vs MA</th><th>Fib</th><th>Price</th><th>Target</th></tr></thead><tbody>`+
        pk.map(p=>`<tr class="stk" onclick="openStock('${p.s}')"><td><span class="sym">${p.s}</span>${flagChip(p)}<span class="cmp">${p.n||''}</span><span class="edit" title="chart" onclick="event.stopPropagation();location.href='marle_g_chart.html?q=${p.s}'">📈</span></td>
          <td style="text-align:left">${gatedTenure(p)}</td>
          <td style="text-align:left">${p.industry?`<span style="color:var(--saffron)">${p.industry}</span> <span style="color:var(--dim);font-size:9px">#${p.ind_rank}${p.sector_leading?' · sec✓':''}</span>`:`<span style="color:var(--muted)">${p.sector||''}</span>`}</td>
          <td><b style="color:var(--green)">${p.ud}</b> &gt; ${p.ud_ma}</td><td>${p.fib}</td>
          <td>₹${(p.price||0).toLocaleString('en-IN')}</td>
          <td><b style="color:var(--green)">₹${(p.target||0).toLocaleString('en-IN')}</b> (+${p.tgtpct}%)</td></tr>`).join('')+`</tbody></table>`
        :(GSTRICT?'<div style="color:var(--muted);padding:12px">No news-clean names right now — every gated pick carries an earnings/news/spike footprint. Strict by design.</div>':'<div style="color:var(--muted);padding:12px">No stocks pass all gates right now.</div>');
    const weak = (d.shorts&&d.shorts.length)?
      `<div class="sh" style="color:var(--red);margin-top:18px">⚠️ WEAKEST CONFLUENCE · ${d.shorts.length} names · AVOID longs / hedge ref</div>`+
      `<div style="font-family:var(--mono);font-size:9.5px;color:var(--dim);margin:-4px 0 8px">Inverse gate (lagging industry/group + U/D falling + broken below fib). Backtested: <b style="color:var(--red)">shorting these LOST ~0.8–1.1% net</b> — they mean-revert up. Names to <b>avoid going long / hedge against</b>, NOT a short signal.</div>`+
      `<table><thead><tr><th>Symbol</th><th>Sector</th><th>U/D vs MA</th><th>Fib</th><th>Price</th></tr></thead><tbody>`+
      d.shorts.slice(0,20).map(p=>`<tr class="stk" onclick="openStock('${p.s}')"><td><span class="sym">${p.s}</span><span class="cmp">${p.n||''}</span></td><td style="text-align:left;color:var(--muted)">${p.sector}</td><td><b style="color:var(--red)">${p.ud}</b> &lt; ${p.ud_ma}</td><td>${p.fib}</td><td>₹${(p.price||0).toLocaleString('en-IN')}</td></tr>`).join('')+`</tbody></table>`
      :'';
    const indNote = (d.leading_industries&&d.leading_industries.length)
      ? `<div style="font-family:var(--mono);font-size:9.5px;color:var(--dim);margin:-4px 0 8px">🔄 <b style="color:var(--saffron)">Gate 1 = leading industry</b> (backtested to beat the old coarse sector gate). Leading now: ${d.leading_industries.slice(0,8).map(g=>`${g.group} <span style="color:var(--green)">${g.ret20>0?'+':''}${g.ret20}%</span>`).join(' · ')}</div>`
      : '';
    const efNote = `<div style="font-family:var(--mono);font-size:9.5px;color:var(--dim);margin:-4px 0 8px">🔒 organic accumulation · ⚠ earnings/news/spike footprint (event-driven — don't get fooled). "strict" hides the ⚠ names${d.n_strict!=null?` · ${d.n_strict}/${d.n} clean`:''}.</div>`;
    f.innerHTML=toggle+`<div class="sh" style="color:var(--green)">🎯 GATED LONGS · ${GATEDMODE} · ${GSTRICT?pk.length+' news-clean':d.n+'/'+d.universe} · gate 1 = leading industry · as of ${d.asof||''}</div>`+note+efNote+indNote+longs+weak;
  }catch(e){ f.innerHTML=toggle+'<span style="color:var(--dim)">unavailable</span>'; }
}
window.MG_SELF_REFRESH = true;   // self-refreshes every 5 min (below) — nav.js skips its 60s full reload
async function loadVolumeState(){
  try{
    const d=await (await fetch('/api/volume_state')).json();
    if(!d.ok){ $('vstate').innerHTML=''; return; }
    const c=d.counts, bc={disciplined:'var(--green)',heating:'var(--amber)',blowoff:'var(--red)',weak:'var(--dim)'};
    const row=x=>{const tt=x.state==='gold'?('🎯 TARGET ₹'+x.target+' reached'):x.state==='green'?('▲ climbing · +'+x.to_target_pct+'% to ₹'+x.target):('▼ '+(x.why_watch||'false move'));
      return '<div class="vs-row '+x.state+'" onclick="window.openStock&&openStock(\''+x.s+'\')">'+
        '<span class="vs-sym">'+x.s+'</span>'+
        '<span class="vs-ud" style="color:'+bc[x.ud_band]+'">U/D '+x.ud+' · '+x.ud_band+(x.ud_rising?' ↑':'')+'</span>'+
        '<span style="font-family:var(--mono);font-size:12px">₹'+x.now+' <span style="color:'+(x.chg>=0?'var(--green)':'var(--red)')+'">'+(x.chg>=0?'+':'')+x.chg+'%</span></span>'+
        '<span style="font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto">'+tt+(x.streak?' · '+x.streak+'d':'')+'</span></div>';};
    let h='<div style="font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:10px">🎨 live state · '+d.price_source+' · '+d.asof+' &nbsp; 🟡'+c.gold+' reached · 🟢'+c.green+' climbing · 🔴'+c.red+' false · '+c.blowoff+' blow-off held back</div>';
    h+='<div class="vs-h">✅ main — promoted (held the gate ≥2 sessions · disciplined U/D) · '+d.n_main+'</div>'+(d.main.length?d.main.map(row).join(''):'<div style="color:var(--dim);font-size:12px">none promoted yet</div>');
    h+='<div class="vs-h">👁 watchlist — gate-2, provisional ('+d.n_watch+') · promotes once it holds the gate with a disciplined U/D</div>'+(d.watch.length?d.watch.slice(0,30).map(row).join(''):'<div style="color:var(--dim);font-size:12px">empty</div>');
    h+='<div style="font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:8px">'+(d.note||'')+'</div>';
    $('vstate').innerHTML=h;
  }catch(e){ $('vstate').innerHTML=''; }
}
load(); loadVolumeState();
setInterval(()=>{ load(); if($('gatedpanel') && $('gatedpanel').style.display!=='none') loadGated(); }, 300000);  // refresh table + gated panel (if open) every 5 min
setInterval(loadVolumeState, 50000);   // live state board — fast refresh
