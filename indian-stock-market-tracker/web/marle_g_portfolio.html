<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio · Marle-G</title>
<style>
  :root{ --bg:#080a0e;--bg2:#0e1116;--card:#14171e;--border:rgba(255,255,255,.08);
    --ink:#eef1f6;--muted:#9aa3b4;--dim:#646c7a;--mono:'SF Mono',ui-monospace,Consolas,monospace;
    --saffron:#ff9933;--india-green:#138808;--green:#22c55e;--red:#ef4444;--amber:#fbbf24;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1100px 520px at 50% -10%,rgba(255,153,51,.05),transparent 60%),var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--border);background:rgba(8,10,14,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .brand{font-family:var(--mono);font-weight:800;letter-spacing:.18em;font-size:13px;display:flex;align-items:center;gap:9px}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--saffron),var(--india-green))}
  .brand .w{background:linear-gradient(90deg,var(--saffron),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabs{display:flex;gap:16px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
  .tabs a{color:var(--dim);text-decoration:none}.tabs a.on{color:var(--saffron)}.tabs a:hover{color:var(--ink)}
  .preview-tag{font-family:var(--mono);font-size:9px;color:#0a0b0f;background:var(--amber);padding:3px 8px;border-radius:5px;font-weight:800}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 24px 70px}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .scard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px}
  .scard.hero{border-left:3px solid var(--saffron)}
  .scard .n{font-family:var(--mono);font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .scard .v{font-family:var(--mono);font-size:22px;font-weight:800;margin-top:5px}
  .pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
  .sh{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  table.h{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
  .h th{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);text-align:right;padding:8px 10px;border-bottom:1px solid var(--border)}
  .h th:first-child,.h td:first-child{text-align:left}
  .h td{padding:9px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04)}
  .h .sym{font-weight:700}.h .nm{font-size:10px;color:var(--dim)}
  .tag{font-family:var(--mono);font-size:8.5px;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--muted)}
  .x{color:var(--dim);cursor:pointer}.x:hover{color:var(--red)}
  .btn{font-family:var(--mono);font-size:10.5px;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--muted)}
  .btn:hover{border-color:var(--saffron);color:var(--saffron)}
  .alloc{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:8px}
  .alloc span{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:#0a0b0f;font-weight:700}
  .legend{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.5;margin-top:8px}
  .empty{text-align:center;padding:46px 20px;color:var(--muted)} .empty a{color:var(--saffron);text-decoration:none;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="nav">
  <div class="brand"><span class="mark"></span><span>MARLE<span class="w">·G</span></span></div>
  <div class="tabs">
    <a href="marle_g_pod.html">home</a><a href="marle_g_equity.html">equity</a><a href="marle_g_volume.html">volume</a><a href="marle_g_options.html">options</a>
    <a href="marle_g_funds.html">funds</a><a href="#" class="on">portfolio</a>
    <a href="marle_g_macro_preview.html">macro</a><a href="marle_g_dashboard.html">dashboard</a><a href="marle_g_profile.html">profile</a>
  </div>
</div>

<main class="wrap">
  <div id="modebar"></div>
  <div class="summary" id="summary"></div>
  <div id="body"></div>
</main>

<script src="marleg_stockmodal.js"></script>
<script>
const $=id=>document.getElementById(id);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const pct=(x,d=2)=>(x>0?'+':'')+(+x).toFixed(d)+'%';
const cls=x=>x>0?'pos':x<0?'neg':'neu';
function _seed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ((h>>>0)%100000)/100000;}
function getPF(){try{return JSON.parse(localStorage.getItem('marleg_portfolio')||'[]');}catch(e){return [];}}
function setPF(a){localStorage.setItem('marleg_portfolio',JSON.stringify(a));render();}
let QUOTES={};
let MODE = localStorage.getItem('marleg_mode') || 'paper';
function setMode(m){ MODE=m; localStorage.setItem('marleg_mode',m); render(); }
function renderModebar(){
  const a=(m,label)=>`<button class="btn" style="${MODE===m?'background:var(--saffron);color:#160f02;border-color:var(--saffron);font-weight:700':''}" onclick="setMode('${m}')">${label}</button>`;
  $('modebar').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:14px">${a('paper','📝 Paper book')}${a('live','● Live · Groww')}</div>`;
}
async function render(){ renderModebar(); return MODE==='live'?renderLive():renderPaper(); }
async function loadQuotes(syms){ if(!syms.length)return; try{const r=await fetch('/api/quote?symbols='+syms.map(encodeURIComponent).join(','));QUOTES=await r.json();}catch(e){QUOTES={};} }
function curPrice(sym,entry){ const q=QUOTES[(sym||'').toUpperCase()]; return (q&&q.price)?q.price:Math.round(entry*100)/100; }
function aggregate(){
  const raw=getPF(); const map={};
  raw.forEach(t=>{ const k=t.sym; map[k]=map[k]||{sym:t.sym,name:t.name||t.sym,qty:0,cost:0,cls:t.cls||'EQ'};
    map[k].qty+=t.qty; map[k].cost+=t.qty*t.price; });
  return Object.values(map).filter(p=>Math.abs(p.qty)>1e-6).map(p=>{
    const avg=p.cost/p.qty, ltp=curPrice(p.sym,avg), mv=p.qty*ltp, pl=mv-p.cost, plpct=p.cost?pl/Math.abs(p.cost)*100:0;
    return {...p,avg,ltp,mv,pl,plpct};
  });
}
async function renderPaper(){
  const raw0=getPF(); await loadQuotes([...new Set(raw0.map(t=>t.sym))]);
  const pos=aggregate();
  if(!pos.length){
    $('summary').innerHTML=''; $('body').innerHTML=`<div class="card empty"><div style="font-size:40px;margin-bottom:10px">💼</div>
      <div style="font-size:16px;font-weight:600;color:var(--ink)">No positions yet</div>
      <div style="margin-top:8px">Go to the <a href="marle_g_equity.html">Equity Monitor</a>, scan a stock and hit <b style="color:var(--green)">Paper Buy</b>.</div>
      <div style="margin-top:14px"><button class="btn" onclick="loadDemo()">＋ load a demo portfolio</button></div></div>`;
    return;
  }
  const invested=pos.reduce((a,p)=>a+Math.abs(p.cost),0), mv=pos.reduce((a,p)=>a+p.mv,0), pl=mv-invested;
  const today=pos.reduce((a,p)=>a+p.mv*((_seed(p.sym+'td')-0.5)*0.03),0);
  $('summary').innerHTML=[
    ['Market value',inr(mv),'hero',''],
    ['Invested',inr(invested),'',''],
    ['Total P&L',inr(pl)+' ('+pct(pl/invested*100)+')','',cls(pl)],
    ["Today's P&L",inr(today),'',cls(today)],
    ['Positions',pos.length,'',''],
  ].map(s=>`<div class="scard ${s[2]}"><div class="n">${s[0]}</div><div class="v ${s[3]}">${s[1]}</div></div>`).join('');

  // tax estimate (unrealised, equity STCG 20% / LTCG 12.5% over 1.25L). Assume all <12m for preview → STCG.
  const gains=pos.filter(p=>p.pl>0).reduce((a,p)=>a+p.pl,0);
  const stcg=gains*0.20;
  // allocation
  const byCls={}; pos.forEach(p=>byCls[p.cls]=(byCls[p.cls]||0)+p.mv);
  const colors={EQ:'var(--saffron)',ETF:'#fbbf24',MF:'var(--india-green)'};
  const allocHtml=Object.entries(byCls).map(([k,v])=>`<span style="width:${v/mv*100}%;background:${colors[k]||'#888'}">${v/mv*100>12?k:''}</span>`).join('');

  $('body').innerHTML=`
    <div class="card">
      <div class="sh"><span>Holdings</span><span><button class="btn" onclick="loadDemo()">＋ demo</button> <button class="btn" onclick="if(confirm('Reset portfolio?')){localStorage.removeItem('marleg_portfolio');render();}">reset</button></span></div>
      <table class="h"><thead><tr><th>Symbol</th><th>Qty</th><th>Avg cost</th><th>LTP</th><th>Mkt value</th><th>P&L</th><th>P&L %</th><th></th></tr></thead><tbody>
      ${pos.map(p=>`<tr><td><span class="sym" style="cursor:pointer" onclick="openStock('${p.sym}')">${p.sym}</span> <span class="tag">${p.cls}${p.qty<0?' · SHORT':''}</span><div class="nm">${p.name}</div></td>
        <td>${p.qty}</td><td>${inr(p.avg)}</td><td>${inr(p.ltp)}</td><td>${inr(p.mv)}</td>
        <td class="${cls(p.pl)}">${inr(p.pl)}</td><td class="${cls(p.plpct)}">${pct(p.plpct)}</td>
        <td><span class="x" title="close" onclick="closePos('${p.sym}')">✕</span></td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="sh">Allocation</div>
        <div class="alloc">${allocHtml}</div>
        <div class="legend">${Object.entries(byCls).map(([k,v])=>`${k} ${(v/mv*100).toFixed(0)}%`).join(' · ')}</div>
      </div>
      <div class="card">
        <div class="sh">Tax · STCG / LTCG (est.)</div>
        <div style="font-family:var(--mono);font-size:12px">
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span style="color:var(--muted)">Unrealised gains</span><span>${inr(gains)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span style="color:var(--muted)">If sold now · STCG @20%</span><span class="neg">${inr(stcg)}</span></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:var(--muted)">Held &gt;12m → LTCG @12.5%</span><span>${inr(gains*0.125)} <span style="color:var(--dim)">(after ₹1.25L)</span></span></div>
        </div>
        <div class="legend">Equity rates, FY25-26. Hold past 12 months to convert STCG→LTCG — a real ₹${inr(stcg-gains*0.125).slice(1)} saving on these gains.</div>
      </div>
    </div>`;
}
function closePos(sym){const pf=getPF().filter(t=>t.sym!==sym);setPF(pf);}
function loadDemo(){
  const d=[
    {sym:'RELIANCE',name:'Reliance Industries',qty:20,price:2780,cls:'EQ'},
    {sym:'HDFCBANK',name:'HDFC Bank',qty:30,price:1620,cls:'EQ'},
    {sym:'INFY',name:'Infosys',qty:25,price:1480,cls:'EQ'},
    {sym:'NIFTYBEES',name:'Nippon Nifty BeES',qty:100,price:248,cls:'ETF'},
    {sym:'PPFAS-FLEXI',name:'Parag Parikh Flexi Cap',qty:850,price:78.4,cls:'MF'},
  ];
  setPF(getPF().concat(d));
}
async function renderLive(){
  $('summary').innerHTML='<div class="scard"><div class="n">Loading live account…</div></div>'; $('body').innerHTML='';
  let H={},P={},M={};
  try{H=await (await fetch('/api/holdings')).json();}catch(e){}
  try{P=await (await fetch('/api/positions')).json();}catch(e){}
  try{M=await (await fetch('/api/margin')).json();}catch(e){}
  if(H&&H.error){ $('summary').innerHTML=''; $('body').innerHTML=`<div class="card empty"><div style="font-size:40px;margin-bottom:10px">🔌</div><div style="font-size:16px;font-weight:600;color:var(--ink)">Groww not connected</div><div style="margin-top:8px">${H.error}</div></div>`; return; }
  const holds=((H&&H.holdings)||[]).filter(h=>h.quantity>0);
  const syms=[...new Set(holds.map(h=>h.trading_symbol))]; await loadQuotes(syms);
  const pos=holds.map(h=>{const sym=h.trading_symbol,qty=h.quantity,avg=h.average_price,cost=qty*avg,ltp=curPrice(sym,avg),mv=qty*ltp,pl=mv-cost,plpct=cost?pl/cost*100:0;return {sym,qty,avg,cost,ltp,mv,pl,plpct,cls:'EQ'};});
  const invested=pos.reduce((a,p)=>a+p.cost,0),mv=pos.reduce((a,p)=>a+p.mv,0),pl=mv-invested;
  const cash=(M&&M.clear_cash)||0,used=(M&&M.net_margin_used)||0;
  $('summary').innerHTML=[
    ['Holdings value',inr(mv),'hero',''],['Invested',inr(invested),'',''],
    ['Unrealised P&L',inr(pl)+(invested?' ('+pct(pl/invested*100)+')':''),'',cls(pl)],
    ['Cash · clear',inr(cash),'',''],['Margin used',inr(used),'',''],
  ].map(s=>`<div class="scard ${s[2]}"><div class="n">${s[0]}</div><div class="v ${s[3]}">${s[1]}</div></div>`).join('');
  const plist=(P&&P.positions)||[];
  const posRows=plist.map(p=>{
    const sym=p.trading_symbol||'—', rp=p.realised_pnl||0, cq=p.credit_quantity||0, dq=p.debit_quantity||0;
    const net=(p.quantity!=null?p.quantity:(dq-cq));
    const isShort=(p.segment==='FNO'?cq>dq:net<0);   // FNO credit = sold/short
    const dir=isShort?' <span class="tag" style="color:var(--red)">SHORT</span>':(net>0?' <span class="tag" style="color:var(--green)">LONG</span>':'');
    return `<tr><td><span class="sym">${sym}</span> <span class="tag">${p.product||''} · ${p.segment||''}</span>${dir}</td><td>${net}</td><td>${inr(p.net_price||p.credit_price||0)}</td><td class="${cls(rp)}">${inr(rp)}</td></tr>`;}).join('');
  $('body').innerHTML=`
    <div class="card">
      <div class="sh"><span>Holdings · <span style="color:var(--green)">● LIVE · Groww</span></span><span><button class="btn" onclick="render()">↻ refresh</button></span></div>
      <table class="h"><thead><tr><th>Symbol</th><th>Qty</th><th>Avg cost</th><th>LTP</th><th>Mkt value</th><th>P&L</th><th>P&L %</th></tr></thead><tbody>
      ${pos.map(p=>`<tr style="cursor:pointer" onclick="openStock('${p.sym}')"><td><span class="sym">${p.sym}</span> <span class="tag">${p.cls}</span></td><td>${p.qty}</td><td>${inr(p.avg)}</td><td>${inr(p.ltp)}</td><td>${inr(p.mv)}</td><td class="${cls(p.pl)}">${inr(p.pl)}</td><td class="${cls(p.plpct)}">${pct(p.plpct)}</td></tr>`).join('')||'<tr><td colspan=7 style="color:var(--muted);padding:14px">No delivery holdings</td></tr>'}
      </tbody></table>
    </div>
    ${plist.length?`<div class="card"><div class="sh">Intraday / positions</div><table class="h"><thead><tr><th>Symbol</th><th>Net qty</th><th>Price</th><th>Realised P&L</th></tr></thead><tbody>${posRows}</tbody></table></div>`:''}
    <div class="card" id="gbook"><div class="sh">Options book · net Greeks exposure</div><div style="padding:12px;color:var(--muted)">reading live F&O book…</div></div>`;
  loadGreeksBook();
}
async function loadGreeksBook(){
  const el=document.getElementById('gbook'); if(!el) return;
  let d={}; try{ d=await (await fetch('/api/greeks_book')).json(); }catch(e){ d={ok:false,error:'read failed'}; }
  const head='<div class="sh"><span>Options book · net Greeks exposure</span></div>';
  if(!d||!d.ok){ el.innerHTML=head+'<div style="padding:12px;color:var(--muted)">'+((d&&d.error)||'no read')+'</div>'; return; }
  if(d.empty){ el.innerHTML=head+'<div style="padding:12px;color:var(--muted)">'+(d.note||'no open F&O positions in the live book')+'</div>'; return; }
  const n=d.net;
  const tiles=[['net Δ delta',n.delta,(n.rupee_per_1pct>=0?'+':'')+'₹'+Math.round(n.rupee_per_1pct).toLocaleString()+' / +1%',cls(n.delta)],
    ['net Θ theta','₹'+Math.round(n.theta).toLocaleString()+'/day',n.theta>=0?'collect decay':'pay decay',cls(n.theta)],
    ['net Vega','₹'+Math.round(n.vega).toLocaleString(),'per +1 IV-pt',cls(n.vega)],
    ['net Γ gamma',n.gamma,'δ change per ₹1','']];
  let h='<div class="sh"><span>Options book · net Greeks exposure · <span style="color:var(--green)">● LIVE</span></span></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:4px 0 10px">'+
     tiles.map(t=>'<div class="scard"><div class="n">'+t[0]+'</div><div class="v '+t[3]+'">'+t[1]+'</div><div style="font-size:11px;color:var(--muted)">'+t[2]+'</div></div>').join('')+'</div>';
  if(d.legs&&d.legs.length){
    h+='<table class="h"><thead><tr><th>Leg</th><th>Qty</th><th>Spot</th><th>IV</th><th>Δ</th><th>Γ</th><th>Θ</th><th>Vega</th></tr></thead><tbody>'+
       d.legs.map(l=>'<tr><td><span class="sym">'+l.symbol+'</span></td><td>'+l.qty+'</td><td>'+l.spot+'</td><td>'+(l.iv||'—')+'</td><td class="'+cls(l.delta)+'">'+Math.round(l.delta)+'</td><td>'+l.gamma+'</td><td class="'+cls(l.theta)+'">'+Math.round(l.theta)+'</td><td>'+Math.round(l.vega)+'</td></tr>').join('')+'</tbody></table>';
  }
  h+='<div style="margin-top:6px;font-size:10px;color:var(--muted)">'+(d.source||'')+' · '+(d.asof||'')+' · read-only, never trades</div>';
  el.innerHTML=h;
}
render();
setInterval(()=>{ if(MODE==='live') renderLive(); }, 20000);   // live book auto-refreshes (surveillance)
</script>
  <script src="marle_g_nav.js"></script>
</body>
</html>
