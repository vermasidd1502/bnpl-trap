<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winners / Losers · Marle-G</title>
<style>
  :root{ --bg:#080a0e;--bg2:#0e1116;--card:#14171e;--border:rgba(255,255,255,.08);
    --ink:#eef1f6;--muted:#9aa3b4;--dim:#646c7a;--mono:'SF Mono',ui-monospace,Consolas,monospace;
    --saffron:#ff9933;--india-green:#138808;--green:#22c55e;--red:#ef4444;--amber:#fbbf24;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1100px 520px at 50% -10%,rgba(255,153,51,.05),transparent 60%),var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--border);background:rgba(8,10,14,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .brand{font-family:var(--mono);font-weight:800;letter-spacing:.18em;font-size:13px;display:flex;align-items:center;gap:9px}
  .brand .mark{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--saffron),var(--india-green))}
  .brand .w{background:linear-gradient(90deg,var(--saffron),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabs{display:flex;gap:16px;font-family:var(--mono);font-size:11px;flex-wrap:wrap}
  .tabs a{color:var(--dim);text-decoration:none}.tabs a.on{color:var(--saffron)}.tabs a:hover{color:var(--ink)}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 24px 70px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:10px}
  .head h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .head .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px}
  .clock{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.6}
  .clock b{color:var(--saffron)}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}
  .scard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px}
  .scard.hero{border-left:3px solid var(--saffron)}
  .scard .n{font-family:var(--mono);font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .scard .v{font-family:var(--mono);font-size:22px;font-weight:800;margin-top:5px}
  .scard .s{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px}
  .pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
  .sh{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:12px}
  table.h{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
  .h th{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);text-align:right;padding:8px 10px;border-bottom:1px solid var(--border)}
  .h th:first-child,.h td:first-child{text-align:left}
  .h td{padding:10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04)}
  .h tr:hover td{background:rgba(255,255,255,.02)}
  .h .sym{font-weight:700;cursor:pointer}.h .sym:hover{color:var(--saffron)}.h .nm{font-size:9.5px;color:var(--dim)}
  .badge{font-family:var(--mono);font-size:8.5px;font-weight:800;padding:2px 7px;border-radius:4px}
  .badge.win{background:rgba(34,197,94,.15);color:var(--green)}
  .badge.lose{background:rgba(239,68,68,.15);color:var(--red)}
  .badge.flat{background:rgba(255,255,255,.06);color:var(--dim)}
  .buk{font-size:9px;color:var(--dim)}
  .rail{width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.06);display:inline-block;vertical-align:middle;overflow:hidden;margin-left:6px}
  .rail i{display:block;height:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .mv{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--mono);font-size:11px}
  .mv .s{font-weight:700;cursor:pointer}.mv .s:hover{color:var(--saffron)}
  .note{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.6;margin-top:8px}
  .empty{text-align:center;padding:46px;color:var(--muted)}.empty a{color:var(--saffron)}
</style>
</head>
<body>
<div class="nav">
  <div class="brand"><span class="mark"></span><span>MARLE<span class="w">·G</span></span></div>
  <div class="tabs"></div>
</div>

<main class="wrap">
  <div class="head">
    <div>
      <h1>Winners <span class="neu">/</span> Losers</h1>
      <div class="sub" id="asof">loading live book…</div>
    </div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="summary" id="summary"></div>
  <div id="book"></div>
  <div id="movers"></div>
</main>

<script src="marleg_stockmodal.js"></script>
<script src="marle_g_nav.js"></script>
<script>
window.MG_SELF_REFRESH=true;   // self-polls every 20s — nav.js skips full-reload
const $=id=>document.getElementById(id);
const inr=n=>(n<0?'−₹':'₹')+Math.abs(Math.round(n)).toLocaleString('en-IN');
const pct=(x,d=2)=>(x>0?'+':'')+(+x).toFixed(d)+'%';
const cls=x=>x>0?'pos':x<0?'neg':'neu';
function openSym(s){try{window.openStock&&window.openStock(s);}catch(e){}}

function clocks(){
  const now=new Date();
  const o={weekday:'short',hour:'2-digit',minute:'2-digit',hour12:true};
  const ist=now.toLocaleString('en-US',{timeZone:'Asia/Kolkata',...o});
  const ct =now.toLocaleString('en-US',{timeZone:'America/Chicago',...o});
  $('clock').innerHTML=`IST <b>${ist}</b><br>US-CT ${ct}`;
}
setInterval(clocks,1000); clocks();

function rail(pct){ // -ve red left, +ve green right, scaled
  const w=Math.min(100,Math.abs(pct)*8);
  const col=pct>0?'var(--green)':pct<0?'var(--red)':'var(--dim)';
  return `<span class="rail"><i style="width:${w}%;background:${col}"></i></span>`;
}

function render(d){
  const t=d.totals||{};
  $('asof').textContent=`real Groww book · marked live · ${d.asof}  ·  auto-refresh 20s`;
  $('summary').innerHTML=[
    ['Day P&L', inr(t.day_pnl), cls(t.day_pnl), "today's move on your net qty",'hero'],
    ['Unrealized P&L', inr(t.unreal), cls(t.unreal), 'open positions vs your cost',''],
    ['Realised today', inr(t.realised), cls(t.realised), 'booked intraday',''],
    ['Scoreboard', `<span class="pos">${t.winners}</span> <span class="neu">/</span> <span class="neg">${t.losers}</span>`, '', 'winners / losers in book','']
  ].map(c=>`<div class="scard ${c[4]}"><div class="n">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div><div class="s">${c[3]}</div></div>`).join('');

  const rows=(d.book||[]);
  if(!rows.length){ $('book').innerHTML=`<div class="card empty">No live positions. <a href="marle_g_portfolio.html">Portfolio →</a></div>`; }
  else $('book').innerHTML=`<div class="card"><div class="sh">Your book — winners on top, losers below</div>
    <table class="h"><thead><tr>
      <th>stock</th><th>qty</th><th>avg</th><th>ltp</th><th>today</th><th>my P&L</th><th>P&L %</th><th>where</th><th></th>
    </tr></thead><tbody>${rows.map(r=>{
      const buk=Object.entries(r.buckets||{}).map(([k,v])=>`${k} ${inr(v)}`).join(' · ')||'—';
      const bd=r.tag==='winner'?'win':r.tag==='loser'?'lose':'flat';
      return `<tr>
        <td><span class="sym" onclick="openSym('${r.sym}')">${r.sym}</span><div class="nm">${(r.name||'').slice(0,28)}</div></td>
        <td>${r.net_qty}</td><td>${r.avg??'—'}</td><td>${r.ltp??'—'}</td>
        <td class="${cls(r.day_chg)}">${r.day_chg==null?'—':pct(r.day_chg)}</td>
        <td class="${cls(r.unreal)}">${inr(r.unreal)}</td>
        <td class="${cls(r.unreal_pct)}">${r.unreal_pct==null?'—':pct(r.unreal_pct)}${rail(r.unreal_pct||0)}</td>
        <td class="buk">${buk}</td>
        <td><span class="badge ${bd}">${r.tag}</span></td>
      </tr>`;}).join('')}</tbody></table>
    <div class="note">“today” = the stock's move since yesterday's close. “my P&L” = live price vs <i>your</i> cost.
    They diverge: a stock can be flat today while your position is red because you bought above the current price.</div>
  </div>`;

  const m=d.movers||{up:[],down:[]};
  const col=(title,list,sign)=>`<div class="card"><div class="sh">${title}</div>${
    (list||[]).map(z=>`<div class="mv"><span class="s" onclick="openSym('${z.sym}')">${z.sym} <span class="nm" style="color:var(--dim)">${(z.name||'').slice(0,20)}</span></span><span class="${cls(z.chg)}">${pct(z.chg)}</span></div>`).join('')||'<div class="note">—</div>'}</div>`;
  $('movers').innerHTML=`<div class="grid2">${col('▲ Watchlist — leading today',m.up,1)}${col('▼ Watchlist — lagging today',m.down,-1)}</div>`;
}

async function load(){
  try{ const d=await (await fetch('/api/winners')).json();
    if(d.error){ $('asof').textContent='Groww unavailable: '+d.error; return; }
    render(d);
  }catch(e){ $('asof').textContent='load error: '+e; }
}
load(); setInterval(load,20000);
</script>
</body>
</html>
